l_english:

 ## Formables ##
 form_hudsonia:0 "Form Hudsonia"
 form_hudsonia_desc:0 "The many peoples and faiths of the Hudson lay separate and divided. If only one were to take to take up the sword, and unite this rich land...\n\nUpon forming #Y Hudsonia#!, we will have the choice to move our capital."
 HDD:0 "Hudsonia"
 HDD_ADJ:0 "Hudsonian"
 hudsonia_does_not_exist:0 "#Y Hudsonia#! does not exist."
 hudsonia_claims_tooltip:0 "Hudsonia will gain claims on the region of #Y Hudsonia#! and the province of #Y Buffalo#!."
 
 form_lwizyan:0 "Form Lwizyan"
 form_lwizyan_desc:0 "Once ruled by venerable and mighty kings, from the mighty Lanpero Napoleon, to the champion of the people, Rwa Long, the swamps and bayous of Lwizyan stand in comparison to no other. The Pelican State must be reunited!"
 LWZ_NAME:0 "Lwizyan" 
 LWZ_ADJ:0 "Lwizyanais"
 lwizyan_does_not_exist:0 "#Y Lwizyan#! does not exist."
 lwizyan_claims_tooltip:0 "Lwizyan will gain claims on the region of #Y Lwizyan#!."

 form_upper_louisiana:0 "Form Haute-Louisiane"
 form_upper_louisiana_desc:0 "Long ago, the lands of Missouri, Illinois, and Indiana were ruled by a mighty Emperor of the French, all united under the name of Haute-Louisiane.Times have changed, and few remember this long gone realm but ourselves. Let us restore this legendary land!"
 formable_not_upper_louisiana_exists:0 "#Y Haute-Louisiane#! does not exist."
 UPPER_LOUISIANA_NAME:0 "Haute-Louisiane"
 UPPER_LOUISIANA_ADJECTIVE:0 "Haute-Louisianais"
 form_upper_louisiana_claims_tooltip:0 "Haute-Louisiane will get claims on the regions of #Y Missouri#!, #Y Indiana#!, and on the areas of #Y Vincennes#! and #Y Evansville#!."

 form_missouri_rhineland:0 "Form the Missouri Rheinland"
 form_missouri_rhineland_desc:0 "The rich Missouri Rheinland has fed many farms and vineyards throughout the ages. All of Missouri's most important cities lay in this region - why should it not be unified under a Weinstrasser banner?"
 formable_not_missouri_rhineland_exists:0 "#Y Missouri Rheinland#! does not exist."
 MISSOURI_RHINELAND_NAME:0 "Rheinland"
 MISSOURI_RHINELAND_ADJECTIVE:0 "Rheinländer"
 form_missouri_rhineland_claims_tooltip:0 "Rheinland will get claims on the region of #Y Missouri#!."

 form_boonslick:0 "Form Boonslick"
 form_boonslick_desc:0 "In times of yore, this area was settled by an explorer named Boone, and was thus named Boonslick, or Boone's Lick. Boonslick has always been a key path on the road to the west, and a single ruler could administer this area much better than several."
 formable_not_boonslick_exist:0 "#Y Boonslick#! does not exist."
 BOONSLICK_NAME:0 "Boonslick"
 BOONSLICK_ADJECTIVE:0 "Boonslicker"

 form_wisconsin:0 "Form Wisconsin"
 form_wisconsin_desc:0 "Like the proud Badger that is the namesake of this land, the Badgerlanders have stood indomitable, an unconquerable force in the face of numerous foes. If we were only to unite our people, who can say what we may accomplish. Forward!" 
 wisconsin_does_not_exist:0 "#Y Wisconsin#! does not exist."
 wisconsin_claims_tooltip:0 "Wisconsin will gain claims on the region of #Y Wisconsin#!."
 WISCONSIN_NAME:0 "Wisconsin"
 WISCONSIN_ADJECTIVE:0 "Wisconsinite"
 WISCONSIN_GERMAN_NAME:0 "Grünbuchtland"
 WISCONSIN_GERMAN_ADJECTIVE:0 "Grünbuchtlander"
 form_wisconsin_walloon:0 "Form Ouisconsin"
 form_wisconsin_walloon_desc:0 "Long ago, across the sea, the Walloons made their home in Ouisconsin. We have perservered throughout the ages - this is our home as it is any other's"
 WISCONSIN_WALLOON_NAME:0 "Ouisconsin"
 WISCONSIN_WALLOON_ADJECTIVE:0 "Ouisconsinais"

 form_north_star:0 "Form the Principality of the North Star"
 form_north_star_desc:0 "The North Star has always shone the brightest. With the aid of Polaris, we can strive to reach new heights."
 minnesota_does_not_exist:0 "#Y North Star#! does not exist."
 minnesota_claims_tooltip:0 "North Star will gain claims on the region of #Y North Star#!."
 MINNESOTA_NAME:0 "North Star"
 MINNESOTA_ADJECTIVE:0 "Minnesotan"

 form_twainist_empire:0 "Form the Republic of the Mississippi"
 form_twainist_empire_desc:0 "Once, the great philosphers and cities of the Great River were united under one banner, before being cast down by the perfidious rust cultists. It is only through sheer will and determination alone, that this once mighty republic can be restored, and balance be restored to Columbia."
 formable_not_twainist_empire_exists:0 "#Y The Mississippi#! does not exist."
 TWAINIST_EMPIRE_NAME:0 "The Mississippi"
 TWAINIST_EMPIRE_ADJECTIVE:0 "Mississippian"
 twainist_empire_modifier:0 "Mississippi Reborn"
 desc_twainist_empire_modifier:0 "No longer a distant memory, the Grand Republic of The Mississippi has been reborn."
 COLUMBIA_NAME:0 "Columbia"
 COLUMBIA_ADJECTIVE:0 "Columbian"
 mississippi_heritage:0 "Heritage of the Grand Republic of The Mississippi"
 mississippi_heritage_desc:0 "Twainist tradition holds that shortly after the event, the Twainists were among the first groups to emerge out of the fires of The Event. Their realm, the Grand Republic of The Mississippi, held sway over the Great River and her tributaries, ushering in a new golden age. But in time, this great republic was cast down, destroyed by the rust cultists and other enemies of Columbia. Now, this mighty realm has been restored, once again bringing balance to the center of America."
 columbia_twainist_heritage:0 "Heritage of the Age of Columbia"
 columbia_twainist_heritage_desc:0 "In times of yore, Old America was governed by the wise and stern Uncle Sam. However, he succumbed to the ravages of time, destroying the old world in the chaos of The Event. After his death, Columbia and her daughters came to populate the land that was once the United States. Now it seems, Columbia has been reborn, led by the prosperous and entreprising Twainists."

 form_california:0 "Unite California"
 form_california_desc:0 "Ever since the Event and the collapse of the Californian Republic, the golden lands of California have been in a state of perpetual chaos and conflict. Although many have tried to claim the mantle of California, their attempts have been foolish, and in vain. It is through our efforts alone, that a new eurekan dawn can rise upon California."
 formable_not_california_exists:0 "#Y California#! does not exist."
 CALIFORNIA_NAME:0 "California"
 CALIFORNIA_ADJ:0 "Californian"
 california_new_culture_tt:0 "We will have the option to adopt a unified #Y Californian#! culture."
 california_claims_tt:0 "#Y California#! will gain claims on the regions of #Y Valley#!, #Y Great Basin#!, #Y Coast#!, #Y Jefferson#!, and #Y Baja California#!."
 california_assimilation_effect_tt:0 "Up to #Y 15%#! of our pops in the #E Californian#! culture group will be #E assimilated#! into our new #E Californian#! culture."
 dont_change_culture_group_tt:0 "We will keep our current culture."
 californian_culture:0 "Californian"
 ff_formable_event_4_title:0 "A New Eurekan Dawn"
 ff_formable_event_4_desc:0 "California, once a fractured and disunited land, has been made whole once again. Despite the differences between our peoples, we share one identity above all - Californian. Are we to cast aside these petty differences, and forge a new path together, or will we remain fractured?"
 ff_formable_event_4.a:0 "We are first Californian."
 ff_formable_event_4.b:0 "Our differences make us all stronger."
 california_empire_heritage:0 "Californian Empire Heritage"
 california_empire_heritage_desc:0 "Once again, the mighty bear stands strong. The formerly disparate lands of California have been brought together, under one ruler, and a new age can begin for California - one of learning, civilization, and prosperity."

 form_upper_missouri:0 "Form Upper Missouri"
 form_upper_missouri_desc:0 "The Upper section of the Missouri River, while not nearly as densely populated, still has a host of important cities and landmarks. Any one state who could control this wild expanse would be sure to profit greatly off of the trade routes in this region."
 UPPER_MISSOURI_NAME:0 "Upper Missouri"
 UPPER_MISSOURI_NAME_GERMAN:0 "Ober Missouri"
 UPPER_MISSOURI_ADJ:0 "Missourian"
 upper_missouri_does_not_exist:0 "#Y Upper Missouri#! does not exist."
 upper_missouri_claims_tooltip:0 "#Y Upper Missouri#! will gain claims on the regions of #Y Dakotas#! and #Y Big Sky#!, and on the areas of #Y Buffalo#!, #Y Ogalla#!, #Y Creighton#!, #Y Omaha#!, #Y Fort Dodge#!, and #Y Council Bluffs#!."
 
 form_missouri:0 "Form Missouri"
 form_missouri_desc:0 "Who could not help but envy the Show Me state, with all her splendor and natural beauty? Let the good of the people be the supreme law."
 MISSOURI_NAME:0 "Missouri"
 MISSOURI_ADJ:0 "Missourian"
 missouri_does_not_exist:0 "#Y Missouri#! does not exist."
 missouri_claims_tooltip:0 "#Y Missouri#! will gain claims on the region of #Y Missouri#!."

 ## Formable Events ##
 ff_formable_event_1_t:0 "A New Capital?"
 ff_formable_event_1_desc:0 "Now that the lands of the Hudson has been brought under our control, there is talk amongst the nobles in our court of a new capital. In times of old, all of Hudsonia was ruled from the capital city of [GetProvince('(int32)6678').GetName].\n\nThere is certainly some benefits to relocating here, however our current capital could be spruced up."
 ff_formable_event_1.a:0 "I'm sure [GetProvince('(int32)6678').GetName] is nice, but I like [ROOT.GetCountry.GetCapital.GetName] more."
 ff_formable_event_1.b:0 "A new capital for a new kingdom!"
 
 ff_formable_event_2_t:0 "Mississippian Metroplises"
 ff_formable_event_2_desc:0 "The coming of [ROOT.GetCountry.GetName] has been heralded with great vigor across the realms of the Mississippi and her tributaries. For the first time in many years, it seems as if peace will finally be brought to the land. The Mississippi has endowed many cities along her banks with great prosperity, [ROOT.GetCountry.GetCapital.GetName] being one of them. There is great talk of relocating our administration to a more suitable one - there is much merit in that argument." 
 ff_formable_event_2.a:0 "Our home is here."
 ff_formable_event_2.b:0 "[GetProvince('(int32)8025').GetName], the home of Author Fitzgerald."
 ff_formable_event_2.c:0 "[GetProvince('(int32)6799').GetName], where Author Twain recieved divine guidance."
 ff_formable_event_2.d:0 "[GetProvince('(int32)4206').GetName], our holiest of places, and the gateway to the West."
 ff_formable_event_2.e:0 "[GetProvince('(int32)8216').GetName], the crown jewel of the Mississippi."
 
 ff_formable_event_3_t:0 "The Age of Columbia"
 ff_formable_event_3_desc:0 "Every well versed Twainist scholar knows of the great empire of old, America, which was led to greatness by Uncle Sam. Author Twain and many other Authors of great merit lived in this golden age, an age which surely must have contained wonders beyond any of our wildest dreams.\n\nAnd yet, I cannot help but find myself reminiscing on this age long since gone. Many claim it to be but a distant dream, nothing more than the musings and imaginings of some select men. It is understood that Uncle Sam has passed on, and Columbia has taken his place. But what if the dream of America were to be pursued...." 
 twainist_columbia_tt:0 "We will take on the task of restoring #Y America#!."
 ff_formable_event_3.a:0 "The age of America has passed."
 ff_formable_event_3.b:0 "The age of America has passed, but Columbia's time has just begun!"
 ## Extra ##
