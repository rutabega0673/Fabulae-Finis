l_english:
 federal:0 "Federal"
 federal_desc:0 "Representing the government of the pre-Event United States, the Federal Government is heavily legalistic, with the three branches, Executive, Legislative, and Judicial, all having checks and balances against the other branches, and each branch plays their part in representing the people."
 federal_ruler:0 "President"
 federal_ruler_female:0 "Madam President"
 federal_co_ruler:0 "Vice President"
 federal_co_ruler_female:0 "Vice President"
 #Federal Laws
 
 republic_military_recruitment_laws_federal:0 "Draft Laws"
 state_militia:0 "State Militia"
 state_militia_desc:0 "Each state is expected to form volunteer only militias, which they will provide equipment and training for."
 regular_army:0 "Regular Army"
 regular_army_desc:0 "The Regular Army is composed of both professional and volunteer troops, allowing for an experienced core of soldiers, but the ability to raise larger forces during wartime."
 universal_draft:0 "Universal Draft"
 universal_draft_desc:0 "During times of conflict, every able bodied citizen is expected to serve in the military in some capacity."
 professional_army:0 "Professional Army"
 professional_army_desc:0 "Under this system, the army is composed only of professional, trained soldiers."
 republic_election_reforms_federal:0 "Executive Law"
 single_term:0 "Single Term"
 single_term_desc:0 "Our President will serve a single term, for this is the best way to preserve democracy."
 washington_precedent:0 "Washington Precedent"
 washington_precedent_desc:0 "Following the example set by Washington, our President will serve two terms, and then step down from office."
 fdr_terms:0 "Roosevelt Precedent"
 fdr_terms_desc:0 "Serving a total of four consecutive terms, Roosevelt's time in office was marked by a strong executive branch."
 martial_law:0 "Martial Law"
 martial_law_desc:0 "During times of war, the President may declare Martial Law, suspending elections, and empowering the President to perform any acts they may see neccesary to protect the Republic."
 corruption_laws_federal:0 "Legislative Law"
 republican_mediterranean_laws_federal:0 "Maritime Law"
 republican_religious_laws_federal:0 "Judicial Law"
 republic_integration_laws_federal:0 "Immigration Law"
 republic_citizen_laws_federal:0 "Citizenship Law"
 republican_land_reforms_federal:0 "Tax Law"
 federal_subject_laws:0 "Federalist Policy"
 dual_federalism:0 "Dual Federalism"
 dual_federalism_desc:0 "Under Dual Federalism, the U.S. Government is limited to its enumerated powers, and all others belong to the States."
 cooperative_federalism:0 "Cooperative Federalism"
 cooperative_federalism_desc:0 "Under Cooperative Federalism, the U.S. Government and states are seen as equal partners, with the Federal government making the laws, and the States enforcing them."
 new_federalism:0 "New Federalism"
 new_federalism_desc:0 "placeholder"

 titanate:0 "Titanate"
 titanate_desc:0 "Ruled by the divinely ordained rulers of Promethean Society, these powerful despots claim descent from various Titans worshiped by various Industrialists. They serve as priest-kings, responsible for securing the blessings of Industry and directing the labor of their subjects towards prosperity. Titanates are often extremly unpopular amongst the lower classes, as their divine rulers often enact harsh labor quotas, all in the interest of Industry of course."
 titanate_ruler:0 "Titan-King"
 titanate_ruler_female:0 "Titan-Queen"
 titanate_consort:0 "Titan-King"
 titanate_consort_female:0 "Titan-Queen"
 titanate_ruler_:0 "Titan-König"
 titanate_ruler_female_deutschamerikaner:0 "Titan-Königin"

 military_dictatorship:0 "Military Dictatorship"
 military_dictatorship_desc:0 "The military has seized power in this state, claiming legitimacy from military might, as well as divine ordination. The General or Dictator is the supreme leader of this state, abandoning all pretenses of democratic rule in favor of an absolute one."
 military_dictatorship_ruler:0 "Commander-in-Chief"
 military_dictatorship_ruler_female:0 "Commander-in-Chief"
 military_dictatorship_ruler_butternutter:0 "Cincinattus"
 military_dictatorship_ruler_female_butternutter:0 "Cincinattus"
 stratocratic_monarchy_ruler_butternutter:0 "Cincinattus"
 stratocratic_monarchy_ruler_female_butternutter:0 "Cincinattus"
 aristocratic_republic_ruler_caesarist:0 "Commander-in-Chief"
 aristocratic_republic_ruler_female_caesarist:0 "Commander-in-Chief"

 military_district:0 "Military District"
 military_district_desc:0 "Claiming legitmacy from the now long defunct Commands, various Military Districts dot the Western United States, ruling zones under martial law, of course all for the betterment of the local populous and eventual restoration of the Nation."
 military_district_ruler:0 "District Commander"
 military_district_ruler_female:0 "District Commander"

 papacy:0 "Papacy"
 papacy_desc:0 "Claiming legitimacy due to losing contact with the old Papacy in Rome, the American Papacy is ran in a similar fashion. The Pope is seen as the head of faith for all Catholic faiths in the new world, although not all choose to heed the power of this upstart."
 papacy_ruler:0 "Pope"
 papacy_ruler_female:0 "Pope"

 haudenosaunee_republic:0 "Seven Nations Confederacy"
 haudenosaunee_republic_desc:0 "The Seven Nations or Haudenosaunee Confederacy is one of the few governments that has a legitmate, rightful claim of a Pre-Event government, said to have been founded by the Great Peacemaker in ancient times. Central to their government is the Great Council, an assembly of 50 hereditary chiefs (Royaner), who each represent the different nations in the Confederacy, making decisions on their behalf. There is no specific leader of the Confederacy, although a Head Royaner is elected to a ceremonial position yearly."
 haudenosaunee_republic_ruler:0 "Head Royaner"
 haudenosaunee_republic_ruler_female:0 "Head Royaner"
 tribal_kingdom_ruler_longhouse:0 "Royaner"
 tribal_federation_ruler_longhouse:0 "Royaner"
 tribal_chiefdom_ruler_longhouse:0 "Royaner"
 
 range_tribal_kingdom:0 "Range"
 range_tribal_kingdom_desc:0 "A collection of many semi-nomadic tribes, sedentary townships, and the odd proper city or two, a Range is ruled by an elected Sheriff and his Deputy, who are appointed by representatives of these settlements."
 range_tribal_kingdom_ruler:0 "Sheriff"
 range_tribal_kingdom_co_ruler:0 "Deputy"
 range_tribal_kingdom_ruler_female:0 "Sheriff"
 range_tribal_kingdom_co_ruler_female:0 "Deputy"
 
