 cascadian_diarchy:0 "Cascadian Diarchy"
 cascadian_diarchy_desc:0 "A theocratical diarchy, this government is headed by the Captain, a Cascadian military and political leader, and a Dryad, a powerful religious leader. The matriarchal societies favor the rule of women, a practice seen as strange and foreign to some of their neighbors."
