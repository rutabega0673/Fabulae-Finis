l_english:

 smithfield_ham:0 "Smithfield Ham"
 desc_smithfield_ham:0 "A widely-renown delicacy across the Old Dominion and beyond, the people of Smithfield have always produced the finest cured-ham on this side of the Mississippi, generations before the great event wiped away the world."

 annheuser_busch_brewery:0 "Annheuser-Busch Brewery"
 desc_annheuser_busch_brewery:0 "The massive brewery built by Titans Annheuser and Busch is still the largest brewery on this side of the Mississippi, producing many hundreds of barrels of beer a day. In addition to being a brewery, the complex has been explanded on, becoming the royal palace of the Busch family. The commoners have mockingly named this residence the 'Palace of Beer'."
 
 rock_island_arsenal:0 "Rock Island Arsenal"
 desc_rock_island_arsenal:0 "Controlling an advantageous position on the Mississippi, the Rock Island Arsenal is said to have the largest collection of old world weapons of anywhere in the world. Although now greatly depleted after many years of plundering, machineguns, rifles, muskets, cannons, and other implements of war are still found within the walls of the formidable Arsenal."





