l_english:
 ## Guruist ##
 deity_guru_sun_tzu:0 "$omen_guru_sun_tzu$"
 omen_guru_sun_tzu:0 "Guru Sun Tzu"
 omen_guru_sun_tzu_desc:0 "#Y Guruist Guru#!\nThe famed writer of the Art of War, Guru Sun Tzu is venerated as the father of strategy within Guruism. Considered one of the greatest military tacticians to ever live, his writings lay the foundation of Californian military strategy. Emphasizing more than battle tactics alone, Guru Sun Tzu taught strategists to consider all other factors surrounding war - economy, diplomacy, intelligence, logistics, and morale. According to the Guru, the ultimate victory is that in which no battle is fought, the ultimate principle which underpins Guruist ethics on war."

