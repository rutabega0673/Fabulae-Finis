l_english:
 ## Lacustrine ##

 ## Pantheon is composed of Heroes, Teachers, and ( ? ) ##

 deity_paul_bunyan:0 "$omen_paul_bunyan$"
 omen_paul_bunyan:0 "Paul Bunyan"
 omen_paul_bunyan_desc:0 "#Y Lacustrine Hero#!\nThe greatest hero of the s, Paul Bunyan is the  Hero of creation, travellers, and loggers. He was a man of immense strength and size, able to move mountains with only himself, his axe, and his pet ox, Babe. It is said that for every step he took, a lake was made in its place, thus making Minnesota the land of 10,000 lakes. He was responsible for the creation of many other geographical features, such as Puget Sound and the Grand Canyon. Although this great hero seems to have moved on from this world, enterprising folk often follow his footsteps throughout America, hoping to gain some of the strength that he had."
 
 deity_hermann:0 "$omen_hermann$"
 omen_hermann:0 "Hermann the German"
 omen_hermann_desc:0 "#Y Lacustrine Hero#!\nA national hero of the Germans, Hermann the German defeated the perifidious Romans, savage, cruel men who sought to subjugate all of Germania. His statue was built in New Ulm to commemorate this victory, and now the mighty Hermann protects the people of Minnesota from those who wish harm upon them."

 deity_green_giant:0 "$omen_green_giant$"
 omen_green_giant:0 "The Green Giant"
 omen_green_giant_desc:0 "#Y Lacustrine Hero#!\nA towering, green skinned man standing at over fifty feet, the Green Giant is a gentle giant. Long ago, when people first came to America, the Green Giant taught them the skills of agriculture and animal husbandry. His lumbering steps leaves fields of ripe green vegetables in his wake, providing food for all."

 deity_urho:0 "$omen_urho$"
 omen_urho:0 "Urho"
 omen_urho_desc:0 "#Y Lacustrine Hero#!\nUrho was renowed for his loud voice, which he got from drinking fish soup and sour whole milk. At the time, the whole of America and Canada was infested by grasshoppers. One could hardly walk outside before being assaulted by a swarm of hungry grasshoppers, as thick as pine needles. Urho, sensing the urgency of the situation, shouted 'Grasshopper, Grasshopper, go to Hell!', thus sending the grasshoppers southward, and saving the farmer's crops from being devoured. His day is celebrated on May 16th, and a great feast is held in memory of this event."

 deity_febold:0 "$omen_febold$"
 omen_febold:0 "Febold Feboldson"
 omen_febold_desc:0 "#Y Lacustrine Hero#!\nFebold Feboldson is a god of the winds. He is regarded as the wrangler of storms, twisters, and winds. Febold turns these normally destructive forces in abundant rainfall, and gentle breezes. "

 deity_gustavus:0 "$omen_gustavus$"
 omen_gustavus:0 "King Gustavus Adolphus"
 omen_gustavus_desc:0 "#Y Lacustrine Teacher#!\nGustavus Adolphus, the legendary first king of Minnesota was renowned for his skills in maths, the arts, and the sciences. Under his reign, Minnesota became a state of great learning and prosperity. The college he founded in St. Peter still stands today."

 deity_antoine:0 "$omen_antoine$"
 omen_antoine:0 "Toine"
 omen_antoine_desc:0 "#Y Lacustrine Hero#!\nToine Barada was a man of prodigious strength. He traveled all over the Midwest, lending assistance by raising entire barns with one hand, and other impressive feats of strength. When he was in St. Louis, Toine lifted an impossibly heavy stone- it weighed over 1,700 pounds. The bystanders were so impressed, that Toine's lifitng of the stone was inscribed on it, so that future generations could learn of him."

 deity_the_twins:0 "$omen_the_twins$"
 omen_the_twins:0 "The Twins"
 omen_the_twins_desc:0 "#Y Lacustrine Heroes#!\nMiller Minneapolis and Saint Paul were two twins. They each founded a city on the banks of the Mississippi, Miller Minneapolis founded Minneapolis, and Saint Paul founded St. Paul. From then on, the two cities have been known as 'the Twin Cities', on account of their founders."

 deity_mufferaw:0 "$omen_mufferaw$"
 omen_mufferaw:0 "Big Joe Mufferaw"
 omen_mufferaw_desc:0 "#Y Lacustrine Hero#!\nThe best man in Ottawa, Big Joe Mufferaw, known the to French-Canadians as Joe Montferrand, was a skilled boxer, especially popular with the ladies, and a hero of the people. They say Ol Joe had a big pet frog, bigger than a horse and he'd bark like a dog! Some of exploits include singlehandedly holding off a mob of 150 Shiners, a local group of ruffians who wanted to rob Mufferaw and his friends, putting out a forest fire with his spit, and accidentially creating the Rideau canal by just walking on a path so many times. "

 deity_father_twain:0 "$omen_father_twain$"
 omen_father_twain:0 "Father Twain"
 omen_father_twain_desc:0 "#Y Lacustrine Teacher#!\nThe wisest and most ancient of men, Father Twain and his wife, Mother Mississippi, parented 10 children. Each of these children went their own way, settling along the Mississippi. Father Twain was also a prolific writer, creating many of the texts that are still around today."

 deity_mother_mississippi:0 "$omen_mother_mississippi$"
 omen_mother_mississippi:0 "Mother Mississippi"
 omen_mother_mississippi_desc:0 "#Y Lacustrine Spirit#!\nThe personification of the Mississippi, Mother Mississippi is the great life giver, the deity that makes life itself possible. The healing waters of the Mississippi are considered sacred by many for this reason."

 deity_ole_olson:0 "$omen_ole_olson$"
 omen_ole_olson:0 "Ole Olson"
 omen_ole_olson_desc:0 "#Y Lacustrine Teacher#!\nPaul Bunyan's blacksmith, Ole Olson possessed a skill with the hammer and anvil like no other. He created a mighty horn that, when blown, could knock down 40 acres of pine trees flat, or create a hurricane out of thin air. Regarded as the greatest blacksmith of all time, Ole Olson taught our people metalworking."

 deity_dylan:0 "$omen_dylan$"
 omen_dylan:0 "Bob Dylan"
 omen_dylan_desc:0 "#Y Lacustrine Teacher#!\nA traveling bard from Duluth, Bob Dylan traveled the country singing songs of the North Country. He was an outspoken champion of the people, and he was kicked out of many a city for being a rabble-rouser."

 deity_prince:0 "$omen_prince$"
 omen_prince:0 "Prince"
 omen_prince_desc:0 "#Y Lacustrine Teacher#!\nAn enigmatic figure, Prince was an early ruler of Minneapolis. He was renowned throughout the land for his musical talent, but one day Prince disappeared, leaving behind only his songs. The residents of Minneapolis say that when Prince vanished, it rained purple that day."

 deity_big_ole:0 "$omen_big_ole$"
 omen_big_ole:0 "Big Ole"
 omen_big_ole_desc:0 "#Y Lacustrine Hero#!\nA giant and expert sailor, Big Ole sailed all the way into the interior of America, visiting as far inland as Minnesota. It is said that the Kensington Runestone chronicles his battles against the fearsome Skraelings in the area. The statue erected in his honor still stands in Alexandria."

 deity_brewer:0 "$omen_brewer$"
 omen_brewer:0 "Brewer"
 omen_brewer_desc:0 "#Y Lacustrine Hero#!\nThe Brewer is lauded across all of Wisconsin for his talent in the art of alcohol making. It was him who first taught the people of Milwaukee the gift of brewing, a process which was named after him. Every October, an 'Oktoberfest' his held in his honor - a festival where people drink, eat, and be merry."

 deity_leif_erikson:0 "$omen_leif_erikson$"
 omen_leif_erikson:0 "Leif Erikson"
 omen_leif_erikson_desc:0 "#Y Lacustrine Hero#!\nIn ancient times, Leif Erikson, or Leif the Lucky, was cast out from a verdant Green-Land, being blown off course, and discovering Vinland, a plentiful land full of vines and grapes. This 'Vinland' as he called it, is said to be America."

 #
 deity_heikki_lunta:0 "$omen_heikki_lunta$"
 omen_heikki_lunta:0 "Heikki Lunta"
 omen_heikki_lunta_desc:0 "#Y Lacustrine Spirit#!\nEqually a blessing and a curse, Heikki Lunta is the god of snow. It is common to perform a chant to the god, in the hopes that he brings down abundant snowfall. But, too much of anything can be a bad thing. If he brings too much snowfall, you would chant 'Heikki Lunta go away', in the hopes that this primordial deity will abate his wrath."

 deity_polaris:0 "$omen_polaris$"
 omen_polaris:0 "Polaris"
 omen_polaris_desc:0 "#Y Lacustrine Spirit#!\nPolaris, the guiding star, will shine their light upon our people, as they go throughout the great cycle of life."

 deity_great_turtle:0 "$omen_great_turtle$"
 omen_great_turtle:0 "The Great Turtle"
 omen_great_turtle_desc:0 "#Y Lacustrine Spirit#!\nThe Great Turtle holds the entire world on his back. He is the spirit of life, creation, and balance."

 deity_sleeping_bear:0 "$omen_sleeping_bear$"
 omen_sleeping_bear:0 "The Sleeping Bear"
 omen_sleeping_bear_desc:0 "#Y  Spirit#!\n"

 deity_minnehaha:0 "$omen_minnehaha$"
 omen_minnehaha:0 "Minnehaha"
 omen_minnehaha_desc:0 "#Y Lacustrine Spirit#!\n"

 deity_ole_fitz:0 "$omen_ole_fitz$"
 omen_ole_fitz:0 "Ole Fitz"
 omen_ole_fitz_desc:0 "#Y Lacustrine Spirit#!\nOle Fitz, the weathered man of the Lakes drowned long ago in the dark waters of Superior. He still lies at the cold bottom of Superior, his body perfectly untouched by the ravages of time."

 deity_thunderbird:0 "$omen_thunderbird$"
 omen_thunderbird:0 "Thunderbird"
 omen_thunderbird_desc:0 "#Y Lacustrine Spirit#!\n"

 deity_the_lady:0 "$omen_the_lady$"
 omen_the_lady:0 "The Lady"
 omen_the_lady_desc:0 "#Y Lacustrine Aspect#!\nThe Lady is an aspect of a complex deity which represents the waters themselves. Other aspects of this singular deity are the Five Sisters and the Witch."

 deity_the_witch:0 "$omen_the_witch$"
 omen_the_witch:0 "The Witch"
 omen_the_witch_desc:0 "#Y Lacustrine Spirit#!\n"

 

 
