l_english:
 ## Ozymandian ##
 deity_oz:0 "$omen_oz$"
 omen_oz:0 "Oz"
 omen_oz_desc:0 "#Y Utopian Aspect#!\nCollectively, the Principles of Utopia are known as Oz. The only true way to achieve Utopia is by following Oz, and only then will the Yellow Brick Road be open."
 deity_cosmopolitan:0 "$omen_cosmopolitan$"
 omen_cosmopolitan:0 "Metropolis"
 omen_cosmopolitan_desc:0 "#Y Utopian Aspect#!\nMetropolis is not an ideal to be achieved, but a grim lesson for the future. In times of old, America was dominated by Metropolis, a fantastic city, whose towers reached towards the very heavens. While the rulers of Metropolis enjoyed great pleasures, the workers of the city languished in the underground factories. Metropolis was eventually brought down by said workers; The Mediator Between the Head and the Hands Must Be the Heart." 
 deity_civilization:0 "$omen_civilization$"
 omen_civilization:0 "Civilization"
 omen_civilization_desc:0 "#Y Utopian Aspect#!\nThe antithesis of Barbarism, one cannot have Prosperity without Civilization. It is for this reason that Civilization must be defended and expanded at any cost."
 deity_altruria:0 "$omen_altruria$"
 omen_altruria:0 "Altruria"
 omen_altruria_desc:0 "#Y Utopian Aspect#!\nWealth, although concentrated in the hands of the few at times, should be distributed equally. This way, all may enjoy the prosperity of Society."
 deity_equality:0 "$omen_equality$"
 omen_equality:0 "Equality"
 omen_equality_desc:0 "#Y Utopian Aspect#!\nEquality is one of the defining aspects of Utopia. Both man and woman alike will share equal rights, and all will enjoy the shared prosperity of Utopia. Thus, one must always strive for Equality."
 deity_utopia:0 "$omen_utopia$"
 omen_utopia:0 "Utopia"
 omen_utopia_desc:0 "#Y Utopian Aspect#!\nDescribed by the great Authors of old, such as Bellamy, George, and Fourier, Utopia is the final stage of human existence, the penultimate goal. Barbarism and the enemies of Utopia will always try to prevent this from happening, as it has happened many times in the past."
 deity_arcadia:0 "$omen_arcadia$"
 omen_arcadia:0 "Arcadia"
 omen_arcadia_desc:0 "#Y Utopian Aspect#!\nArcadia is the pristine countryside, the quaint farmer's house, and the humble lodgings of the hermit.An often overlooked aspect of Oz, Arcadia is every bit as important as the other ones. If Society is not in harmony with Nature, how can Utopia ever be expected to be achieved?"
 deity_great_commoner:0 "$omen_great_commoner$"
 omen_great_commoner:0 "Great Commoner"
 omen_great_commoner_desc:0 "#Y Utopian Aspect#!\nWhile America was in the throes of the Gilded Age, the Great Commoner fought to end the Standard of Gold, and to usher in the Standard of Silver, which would directly benefit the Commoners. Despite his best efforts, the Standard of Gold was not abolished, and for his proselytizing and champion of the Commoners, he was crucified on a cross of Gold by the Wicked Witch of Washington. The greatest martyr of this time will always be remembered on for the future that was promised, and what could have been."
 deity_utopian_union:0 "$omen_utopian_union$"
 omen_utopian_union:0 "Union"
 omen_utopian_union_desc:0 "#Y Utopian Aspect#!\nUnion is the chains, the bonds that tie everyone in Society together, regardless of standing. Collective Action is the only way up towards Utopia; no Man can stand alone."
 deity_governor:0 "$omen_governor$"
 omen_governor:0 "Governor"
 omen_governor_desc:0 "#Y Utopian Aspect#!\nThe one who has a guiding hand, the Governor directs all aspects of Society. An unjust or corrupt Governor may be overthrown, for all Men rule only according to the Laws Society deems neccessary."
 deity_history:0 "$omen_history$"
 omen_history:0 "History"
 omen_history_desc:0 "#Y Utopian Aspect#!\nThe best way to understand the Present is the look backwards. Utopians deeply value the treasures of knowledge that can be found in the ruins of once great cities, for not only is important knowledge contained there, but lessons to learn from."
 deity_pandora:0 "$omen_pandora$"
 omen_pandora:0 "Pandora"
 omen_pandora_desc:0 "#Y Utopian Aspect#!\nPandora is the "
 deity_suffrage:0 "$omen_suffrage$"
 omen_suffrage:0 "Suffrage"
 omen_suffrage_desc:0 "#Y Utopian Aspect#!\n"

