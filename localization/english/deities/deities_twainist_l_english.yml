l_english:
 ## Twainist ##
 deity_twain:0 "$omen_twain$"
 omen_twain:0 "Author Twain"
 omen_twain_desc:0 "#Y Twainist Author#!\nBorn in Hannibal, Missouri, Samuel Clemens was the first and most influential of the Authors. While at the banks of the Mississippi, he recieved a divine omen from the river herself, taking the name 'Mark Twain', and inspiring him to travel all over America, taking in all her sights and beauties. The Novels he wrote on his journeys are reflections of the people and landscape, both good and bad."
 deity_muir:0 "$omen_muir$"
 omen_muir:0 "Author Muir"
 omen_muir_desc:0 "#Y Twainist Author#!\nAuthor Muir was an early advocate for nature, and through many years of careful contemplation and meditation in the wilderness, he came to understand some of the destructive tendencies of Man. His teachings of the unbridled free spirit of the wilderness, and the ways Man can coexist with it are still relevant to this day."
 deity_columbia:0 "$omen_columbia$"
 omen_columbia:0 "Columbia"
 omen_columbia_desc:0 "#Y Twainist Goddess#!\nIn times of yore, Old America, or Uncle Sam was the divine protector of the lands of America. But even divine gods are subject to disease and age, and his daughter, Columbia took her place. It is now Columbia who guides the people to prosperity, in this dangerous and strange age. She is the goddess of Liberty, and represents the freedom all Men inherit."
 deity_mississippi:0 "$omen_mississippi$"
 omen_mississippi:0 "Mississippi"
 omen_mississippi_desc:0 "#Y Twainist Goddess#!\nKnown by many names, Mississippi is the greatest of all rivers, and is thus the most holy to Twainists. It is a common ritual to bathe and swim in her life-giving waters, as doing so is considered a way to not only cleanse oneself, but to further your connection to the Great River."
 deity_whitman:0 "$omen_whitman$"
 omen_whitman:0 "Author Whitman"
 omen_whitman_desc:0 "#Y Twainist Author#!\nKnown as 'the Great American Poet', Author Whitman's works touched the hearts and minds of every American. Through his poetry, Author Whitman strives to tell us of deism - the idea that every creed and faith holds value and legitimacy, no matter how foreign."
 deity_the_comet:0 "$omen_the_comet$"
 omen_the_comet:0 "The Comet"
 omen_the_comet_desc:0 "#Y Twainist Aspect#!\nRepresentative of the cyclical nature of life, and to a greater extent fate, The Comet signals the start and end of important events. Author Twain was born and died on the passing of The Comet, and it is for this reason that Twainists look up to the skies for an omen, whether they interpret it as good or bad."
 deity_the_yankee:0 "$omen_the_yankee$"
 omen_the_yankee:0 "The Yankee"
 omen_the_yankee_desc:0 "#Y Twainist Aspect#!\nThe crass, revolver bearing Yankee is a genius engineer, and a staunch proponent of democracy. He works solely for the benefit of the common man, and strikes down all who oppose him."
 deity_the_pilot:0 "$omen_the_pilot$"
 omen_the_pilot:0 "The Pilot"
 omen_the_pilot_desc:0 "#Y Twainist Aspect#!\nThe Pilot is the one who controls and steadies the waters of the Mississippi. Without him, the flow of the Great River would be unpredictable and dangerous. He is revered by ship captains and merchants, and is seen as a protector of them."
 deity_the_king:0 "$omen_the_king$"
 omen_the_king:0 "The King"
 omen_the_king_desc:0 "#Y Twainist Aspect#!\nAlthough somewhat mired in the past, The King is a just and fair man. He represents the idyllic and antique nature of Pre-Event societies."
 deity_sawyer:0 "$omen_sawyer$"
 omen_sawyer:0 "Tom Sawyer and Huck Finn"
 omen_sawyer_desc:0 "#Y Twainist Aspect#!\nLesser spirits of the Mississippi, Tom Sawyer and Huck Finn are often seen traveling along the Mississippi and her tributaries, in search of adventure."
 deity_faulkner:0 "$omen_faulkner$"
 omen_faulkner:0 "Author Faulkner"
 omen_faulkner_desc:0 "#Y Twainist Author#!\nAuthor Faulkner campaigned for the equality of all men, and that we should not be divided by petty differences."
 deity_big_muddy:0 "$omen_big_muddy$"
 omen_big_muddy:0 "Big Muddy"
 omen_big_muddy_desc:0 "#Y Twainist God#!\nThe two-faced god of the confluence of the Missouri and Mississippi rivers around St. Louis, Big Muddy is a bestower of knowledge, life, and wealth. It is said that sometimes, you can find him standing at the banks of the Great River in St. Louis, one face looking west, and one face looking east."
 deity_baron:0 "$omen_baron$"
 omen_baron:0 "The Baron"
 omen_baron_desc:0 "#Y Twainist Aspect#!\nThe Baron is the sharply dressed, well-mannered harbinger of change. As a whole, he represents the shift in culture over the ages, as the Old America fell away, and the new Columbia took his place."
 deity_missouri:0 "$omen_missouri$"
 omen_missouri:0 "Missouri"
 omen_missouri_desc:0 "#Y Twainist God#!\nWizened and grey-bearded, Missouri is the river that leads to the great path to the west, a land of great oppourtunity, but also of great danger. Many a traveler has sailed down this river, foolishly unaware of the danger that was to come, never to return to their eastern home."
 deity_illinois:0 "$omen_illinois$"
 omen_illinois:0 "Illinois"
 omen_illinois_desc:0 "#Y Twainist God#!\nIndustrious and entreprising, Illinois is the god of metropolises and great urban centers. The river that bears his name runs through one of Old America's most storied cities - Chicago."
 deity_bellamy:0 "$omen_bellamy$"
 omen_bellamy:0 "Author Bellamy"
 omen_bellamy_desc:0 "#Y Twainist Author#!\nBorn in a time of great strife and inequality, Author Bellamy dreamed of a utopian world, realized in his work 'Looking Backward', in which every man worked along each other, common goods are shared amongst the populous, and everyone can fulfill their own needs. Among the Twainists, Author Bellamy has quite a popular following, and his adherents are known as 'Bellamyites'. Most Twainists see them are misguided radicals, who stray too far from the words of Author Twain. But yet they are popular for a reason..."
 deity_spirit_of_st_louis:0 "$omen_spirit_of_st_louis$"
 omen_spirit_of_st_louis:0 "Spirit of St. Louis"
 omen_spirit_of_st_louis_desc:0 "#Y Twainist Spirit#!\nIn an age now long gone, a great pilot flew a flying machine from St. Louis, to across the sea, an accomplishment no man had done before. From then on, the Spirit of St. Louis inhabited the city, taking the form of the red cardinal,blessing and protecting all of her children."

 deity_ulysses:0 "$omen_ulysses$"
 omen_ulysses:0 "Ulysses"
 omen_ulysses_desc:0 "#Y Twainist God#!\nUlysses, the wisest of all men and a great warrior in his own right, fought in a terrible war, one that raged on for ten years. Unable to return home, he became trapped at a cabin named Hardscrabble, where he forgot the ongoing troubles in his house. In these seven years that Ulysses was trapped at Hardscrabble, various suitors had run amuck, trying to seek the hand of his wife Columbia, and thus gain the throne of America. Eventually Ulysses snapped out of his imposed solitude, and embarked on a great campaign, driving the suitors out and reuniting with his wife."

 deity_garland:0 "$omen_garland$"
 omen_garland:0 "Author Garland"
 omen_garland_desc:0 "#Y Twainist Author#!\nA native son of the Driftless, Author Garland was the first to write about this wondrous land of valleys and her people."

 deity_chopin:0 "$omen_chopin$"
 omen_chopin:0 "Author Chopin"
 omen_chopin_desc:0 "#Y Twainist Author#!\nAuthor Chopin defined the difficult role of the mother, describing the challenges faced by them, and the sanctity of motherhood."
 
 


 

