#Events
onondaga_missions_event_1_title:0 "$onondaga_missions_1_task_1$"
onondaga_missions_event_1_desc:0 "[GetProvince('(int32)6853').GetName], formerly a #Y Onondaga#! possesion in time of old has returned to us. [GetCharacter('(int32)37').GetName], in his wisdom, has elected to renovate the old palace of [GetCharacter('(int32)1').GetName], turning it into a proper fortress, along with expanding the palisade already present on the outskirts of the city.\n\nI would like to see those Uticans try to lay siege to [GetProvince('(int32)6853').GetName]'s now mighty walls!"
onondaga_missions_event_1.a:0 "Ours once more."
onondaga_missions_event_1_tooltip:0 "The mission task '#Y $onondaga_missions_1_task_1$#!' has now been #G Completed#!!"

