l_english:

onondaga_missions_1:0 "Keepers of the Fire"
onondaga_missions_1_DESCRIPTION:0 "From the inception of the Haudenosaunee Confederacy long ago, the #Y Onondaga#! have enjoyed a special role in the confederacy, hosting the capital of the league in Onondaga, and being the Firekeepers on the council, sitting in the center. For many centuries, the [GetCulture('haudenosaunee').GetName] have fought tooth and nail against foreign invaders. While the Grand Council was not able to survive the Event, the ideals of $omen_great_peacemaker$ live on. Successive wars in recent years, along the emergence of the Revialist religious movement have spurred our leaders to seek a militaristic policy.\n\nIt is up to us, the Keepers of the Fire, to bring back what once was. "
onondaga_missions_1_CRITERIA_DESCRIPTION:0 "This mission will be completed when the #Y Onondaga#! have restored the traditional borders of the Five Nations, and  the #Y Haudenosaunee Confederacy#!."
onondaga_missions_1_BUTTON_TOOLTIP:0 ""

#Missions

onondaga_missions_1_task_1:0 "Fortifying Syracuse"
onondaga_missions_1_task_1_DESC:0 "While just recently becoming a possesion of ours, Syracuse is the largest city in our nation. With foes so close to our borders, we must make haste to turn Syracuse into an impregnable fortress."

