l_english:

 ## Americanist ##
 americanist:0 "Presidential"
 desc_americanist:0 "The Presidentals believe that the ancient United States was a land uniquely blessed by Providence, a country where every man was free from want, fear and all treachery or tyranny. This prosperity stemmed from the people's belief in the American Dream, which ensured that America stayed on the path of prosperity and liberty. However, that Dream was forsaken by the people of the past, for the America of today is a shadow of its former self; a mere memory of a memory. Yet America can never truly die, and those who still believe in the Dream diligently work towards the day when Providence will once again grant America life, liberty and happiness. They recognize the reformed Presidency founded by Bannister Smithson in 2999, in stark contrast to their western brethren, who have established a regime of their own."

 caesarist:0 "Caesarist"
 desc_caesarist:0 "Worshipping the Soul of America, a pantheistic force, the Caesarists rally behind their leaders in hopes that he will be the prophesized 'American Caesar', a strongman imbued with exceptional greatness and will by the Soul of America. Holding that the Presidency of the United States is vacant, the Caesarists believe that only through military might may law and order be restored, and the Presidency will once again lead America into global hegemony."

 heartful:0 "Heartful"
 desc_heartful:0 "Heartfuls believe in only one God, Providence, who sent down his sons to teach humanity lessons of compassion and honesty. These offspring, the Founders, were partly man, partly divine, who became great heroes to set an example for other mortals. They made war only when necessary, and taught of the Heart and Soul of America. The Heart is the land itself, while the Soul are the people of America, both of which must be treated with decency and respect. After the Founders had built America, they sacrificed themselves for their country, guaranteeing all who they left behind the opportunity to enjoy the bountiful harvest that they had sown. Now that America lies in ruins, it is more important than ever before that the faithful cultivate the same steadfast values that built this country long ago."

 continental:0 "Continental" 
 desc_continental:0 "Unlike most Americanists, the Continental Society believes in a dualist cosmology - Providence, embodied in the Spirit of 76, represents all that is good, while Tyranny's evil is equal in measure. With the courageous leadership of the Founders, America was born as a land of pure freedom, but over time Tyranny grew within the nation like a cancerous wound. Eventually, Tyranny overthrew Old America in the Event, permanently mixing its evil into the land. Continentals reject the modern institutions and trappings of mainstream Americanism, given that positions like the Presidency cannot exist in a reality tainted by Tyranny, and instead assert those institutions will be restored when Tyranny is finally defeated and the universe is purified. To accomplish this goal, the Continentals emulate their Patriot ancestors and their freedom-loving ways, inviting the Spirit of 76 to fortify their souls against tyrannical corruption."

 byzantine_americanists:0 "Neoellinismós"
 desc_byzantine_americanists:0 "A syncretization of Greek Orthodox and Latin Catholic traditions with Americanist values, the Neoellinismos, sometimes known as the Sacred Band, believe that America was the true succesor to Rome- Byzantium."

 ## Christian Faiths ##
 evangelical:0 "Evangelical"
 desc_evangelical:0 "The Evangelical Church is the main claimant to the legacy of antediluvian United States Protestantism. In the face of post-Deluge upheavals, various Protestant churches banded together, putting aside minor theological differences in favor of establishing an Evangelical Convention of Churches presided over by an ecumenical council of bishops. However, some Christians chafe against the doctrines and restrictions imposed by this Convention..."

 catholic:0 "Conclavian"
 desc_catholic:0 "After the Deluge, the surviving Catholic hierarchy in America was given a miraculous sign at the Council of Chicago that confirmed the destruction of the Papacy in Rome; giving the surviving American cardinals the right to hold a papal conclave. The new American Popes lacked a permanent temporal seat for over a century - a period known as "the Wandering Papacy" - until control over the city of Chicago in Illinois was finally achieved. With this newfound authority came a gradual solidification of power, with many formerly independent churches of varying denominations entering communion with the Papacy for various reasons; their traditions being subsumed in the process."

 lutheran:0 "Lutheran"
 desc_lutheran:0 "Born from the teachings of the ancient Martin Luther who lends the movement its name, Lutherans hold many of the same practices as pre-Reformation Christendom, but reject the centralized nature of the Catholic Church as a corrupt entity in favor of decentralized congregations. These congregations solve disputes and dilemmas through conference rather than relying on the decision of a single religious authority. In the wake of the Event, Lutheranism receded greatly, with many of the remaining congregations putting aside differences between one another against the Catholic and Viking ascendancy."

 old_order:0 "Old Order"
 desc_old_order:0 "The Old Order are a collection of groups of Conservative Amish, Mennonites, and Brethren, focused on separation from the outside or 'English' world, a principle of nonviolence, and plain living. These tenets make life after the apocalypse difficult and often quite short. Due to the religious violence and general chaos inherent to the post-Deluge social order, the Old Order has abandoned its former practice of absolute pacifism, but members still strive to avoid violent conflict whenever possible. Using violence in any context - even self-defense - is highly discouraged."

 united_church:0 "United Church"
 desc_united_church:0 "Originally one of the many offshoots of Protestant Christianity in Toronto, the United Church differs from its fellows by its belief that the Holy Spirit acts through all faiths, and that God's will therefore is best understood through dialogue with other creeds. Through inter-faith services, adherents invite members of other faiths into their holy spaces to perform their own rituals, so as to open new pathways to the divine. The Church retains many elements of traditional Protestant Christianity, believing that the Bible is God's most direct revelation to humankind, and that Communion is a holy act."

 colossalist:0 "Colossalist"
 desc_colossalist:0 "Rejecting the cowardice and pathetic humility of other churches, the Colossal Ministries believe that God's house must be magnificent. There can be no expense spared to glorify Jesus Christ, for His Kingdom must display His strength with its opulence. This focus on grandeur and demonstration also extends to His pastors, who minister to adulant crowds of followers on God's might made manifest in them. Each pastor directly rules over their church in a spiritual and literal sense, competing amongst each other for followers and glory in Jesus Christ's name. As only one church can be worthy of God's presence, Colossalist pastor-kings strive to demonstrate they alone are worthy of such an honor."

 quaker:0 "Quaker"
 desc_quaker:0 "Despite the name, the Society of Friends, more commonly referred to as Quakers, is not one unified church but instead a variety of community worship organizations with a common goal - to find the presence of God within them and to follow that inner light of Christ towards righteousness. This light can be discovered both on an individual and community level, with religious and social decisions being made by holding meetings in which the attendees collectively determine what path God desires them to take. Lacking a centralized hierarchy, Quaker communities can differ vastly on some doctrines such as baptism, icons, or even theism, but some common beliefs include pacifism, simple living, and a mission to promote social reform and community harmony."

 mennonite:0 "Mennonite"
 desc_mennonite:0 "One of the largest and oldest of the Anabaptist Protestants, the Mennonite Church traces itself to the teachings of Menno Simons, one of the Radical Reformers in contrast to Calvin or Luther. Aiming to restore the old church of Christianity from the time of its foundation, Mennonites emphasize their service to Christ and the renunciation of the sword and oath. While historically Mennonite communities were divided along degrees of participation with the pre-Event world, those separations were set aside as their policies of religious tolerance and social cohesion allowed them to unite isolated communities left vulnerable by the collapse."

 ursuline:0 "Ursuline"
 desc_ursuline:0 "The Ursuline Church originated as an antediluvian religious order patronized by Saint Ursula. After the Deluge, most French-Canadian Catholics turned to the Ursuline Order for guidance in acknowledgment of the charitable works the Order. The Ursuline Order itself, loosely tied to the larger Catholic complex of the Americas, attended the Ecumenical Council of The Americas in the mid 22nd century. Their stance during and after the Council is that the office of the Pope, and therefore all offices appointed by the Pope, are empty until contact is restored with Rome. The Ursulines uphold the position that none of the Christian bishops currently operating in the Americas have proper apostolic succession, making them invalid. However, members of sanctioned religious orders can serve as de facto clergy until contact with the true Papacy is re-established."

 bostonian:0 "Bostonian"
 desc_bostonian:0 "Splitting from the Conclavian Catholic Church shortly after the Ecumenical Council of The Americas in the mid 22nd century, a new council was held in Boston, and these Bostonians opted for a more decentrlaized system; autocephpaly, or bishops who do not answer to a higher authority, akin to the Eastern Orthodox church of the old world. These 'Bostonians' thus founded the American Free Catholic Church of Boston. Many Catholics dislike the Bostonian's amicability with the Americanists, accusing them of being nothing more than their puppet. These accusations are of course, unfounded."

 traiteurism:0 "Traiteurist"
 desc_traiteurism:0 "Surviving for centuries despite oppression and adversity, Traiteurists believe that the tribulations delivered upon mankind, be it through pestilence or desolation, purify the souls of the faithful and bring them closer to their Lord through His grace. In reward for their endurance, God grants believers the natural bounties of the Earth as a refuge. Named after their method for treating and cleansing the souls of the suffering with prayer and local herbs called "traitement", traiteurs and traiteuses fulfill the spiritual needs of their community. These skilled healers administer the seven sacraments and absolve the sins of the sick through traitement so that they may go directly to Heaven. Additionally, many folk beliefs have been integrated into the faith's canon, such as Jesus being born in Acadia and the veneration of the Archangel Gabriel Lajeunesse."

 exovedate:0 "Exovedate"
 desc_exovedate:0 "The Exovedate are the torchbearers of the teachings of pre-Event prophet, priest-king, and Infallible Pontiff, Louis “David” Riel. Riel saw Native Americans and the Métis as the descendants of the Hebrews and therefore God's chosen people, and tasked himself with building a reconstructed Catholic Church that would bind the people of the New World together. He led a coalition of Métis and other tribes to battle L'Awnglitayr, an oppressive regime from across the sea, in what became known as the Great Parleys. While Riel was defeated, executed, and decried as a madman in his own time, in the centuries since the faithful have come to recognize Riel's prophecies and restore his neglected teachings, including the enforcement of Mosaic law and reinstatement of polygamy and clerical marriage."  
 
 limpio:0 "Limpio"
 desc_limpio:0 "Even before the Deluge, many Catholics believed that certain people had holy powers which enabled them to directly commune with the souls of the dearly departed. These folk beliefs condensed over the years into the Esoteric Fraternity of the Limpios. The Limpios worship a pantheon of spirits derived from local saints and heroes of the past who ultimately serve God but are powerful in their own right. These entities can be called upon for guidance and communed with through rituals, but only bless the most worthy who can then allow themselves to become possessed by a spirit. Through this connection, they earn the honorific of “Cajita”, meaning vessel. These Cajitas act as conduits for one of these divine beings, allowing them to directly influence the world they once roamed as mortals and perform miracles for the benefit of the faithful"

 la_hermandad:0 "La Hermandad"
 desc_la_hermandad:0 "With humble origins in farm workers, Bracero rulers are expected to be workers, in the field as in the castle, to build a New Earth for the glory of God. The Braceros have endured through countless petty kingdoms and would-be tyrants, surviving thanks to their strong core organization around diverse communities and the revered elders who care for them. This struggle against evil on Earth has only amplified as the Antichrist, the office that seeks to unite all religions under the power of the state, unveiled itself in Sacramento. In the face of this apocalyptic evil, the Braceros are willing to fight against any who seek to eradicate their beliefs and way of life."

 particularist:0 "Particularist"
 desc_particularist:0 "Particularists are heirs of the once unquestionably dominant faith of the continent, Catholicism, which was battered by the chaos and the change brought by the Deluge. In need of greater unity and direction than ever, a union of South American archbishops put their political differences aside and decided to unite as a sui iuris particular Catholic Church, and elected the Patriarch of South America to lead them. Originally based in Buenos Aires, the rise of other faiths has displaced the Patriarchy north of the Paraná, to Asunción. While the Particularists have maintained their Catholic Latin rites, traditional folk practices of the River Plate Basin have deeply permeated it. The autonomous ecclesiastical leadership has sanctioned many of its venerated local saints as canonical, as well as the devotions to Gauchito Gil, San La Muerte, and San Roque Gonzalez de Santa Cruz."

 cristero:0 "Cristero"
 desc_cristero:0 "The Cristero Catholic Church is a uniquely Mexican variety of Christianity that survived after the Deluge and subsequently consolidated power. They are distinguished from other Catholic faiths by their special focus on Our Lady of Guadalupe, Empress of the Americas and mother of Christ the King. In addition, the Cristeros believe that the best method of protecting the faith is to preserve the houses of God throughout the continent, as their importance to the history and practice of the religion is unrivaled. To accomplish the task, men of the cloth are expected to go to battle to defend the faith, and all Holy and Lay Orders are placed under the command of the Archbishop Primate who, due to the continued absence of the Bishop of Rome, only answers to Cristo Rey himself."

 insular:0 "Insular"
 desc_insular:0 "The Insular Canon claims descent from Catholicism, but is in reality much changed from the religion of pre-Deluge Rome. Altered by the dynamism and diversity of the Caribbean, the tradition is an umbrella that encompasses countless local Catholic practices, each complete with its own rituals and local saints influenced by the many cultures and creeds that call the Caribbean home. Due to the fractured nature of the region, the faith's identity has more to do with a shared theological lineage with the oldest church of the Americas rather than one of bureaucracy or rigid structure. This tends to be viewed positively by adherents, who view their lack of subjugation beneath any foreign authority as a mark of pride."

 episcopalian:0 "Episcopalian"
 desc_episcopalian:0 "Once the religion of the pre-Deluge American nobility, the Cavalier Church has had its influence massively reduced over the centuries since that great calamity. Still nostalgic for this magnificent past, Cavaliers idealize the lost standards of chivalry and piousness that were once upheld by the elites of society. These bonds of honor and law, based on the teachings of Jesus, had given those of lower birth the freedom to worship God and live decently underneath the protection of their rulers. The church's staunch adherence to tradition and usage of an ancient liturgical book, the Book of Common Prayer, make it a strange anachronism in the modern day. Yet, this gives the faithful all the more motivation to keep their glorious history from ever being forgotten."

 ## Industrialist ##
 promethean:0 "Promethean"
 desc_promethean:0 "One of the first faiths to emerge after the Great Rusting, the Prometheans seek to restore the Gilded Age through the powers of the Titan Kings. They believe that during that time, the world was divided amongst the titans, who served as intermediaries between Industry and the workers. They channeled the labor of the people to Industry and the prosperity of Industry back to the workers. Now that responsibility falls to their descendants, who seek to recreate the ancient society in all its forms and usher in a new Gilded Age."

 arsenalist:0 "Arsenalist"
 desc_arsenalist:0 "At the height of the Gilded Age, America was a land uniquely blessed by Industry. Her people had perfected the rituals and practices necessary to maintain Industry's divinity and in turn were granted unrivalled prosperity. But this came with the expectation that the Americans would use their power to defy the rusted Tyrants who threatened free people the world over. Now the Arsenalists continue this divine mission, seeking to restore Industry to divinity under the guidance of America in order to protect mankind from Tyranny's armies."

 galvanist:0 "Galvanist"
 desc_galvanist:0 "For the Galvanists, the best way to restore Industry and usher in a new Gilded Age is by strictly adhering to the rituals and regulations passed down from the Titans. The Engineers of the Galvanizing Assembly have scoured through ancient texts to figure out these rituals and have spent the ensuing centuries debating exactly how to uphold them. All of this has been recorded in the Codex of Regulations, leaving the Galvanists with an expansive legalistic code covering every aspect of life and instructions for countless sacred rituals."

 sustainablist:0 "Sustainablist"
 desc_sustainablist:0 "The theologians from the School of Sustainment reject the idea that Industry is a force purely of creation, rather its refinement into a god will always require some equivalent exchange, often one made at the expense of humanity and the other Natural Forces. In fact, the Event itself was the predictable conclusion to the reckless pursuit of Industrial power. Instead the Sustainablists revere the positive and helpful Forces of nature, such as Dignity, Life, and Community, as their refinement only destroys negative aspects of reality, while Industry itself is almost completely ignored. This process of elevating the other Forces involves joy and celebration, something the faithful view as a source of pride and symbol of their humanity."

 ## Afro-Diasporic Faiths ##
 vodou:0 "Vodou"
 desc_vodou:0 "Vodou originated in Haiti, and is a mixture of ancient West African beliefs and Catholicism. Vodouists are distinguished by their lack of formal organization and slightly closer relationship to mainstream Christianity. Vodouists also place less of an emphasis on communication with the dead, focusing instead on worship of the loas."
 
 ## Vernacular ## 
 revelationist:0 "Revelationist"
 desc_revelationist:0 "Revelationists believe that when the many forces of Heaven and Hell began the War of Tribulation, the once prosperous Earth was engulfed in spiritual and material chaos. These powerful multitudes fought to a stalemate, and became the powers with dominion over the Earth, calling the dead to become angels or demons to assist their side in the conflict. The faith itself involves delivering fiery sermons regarding divinely revealed concepts and commands which have been given by the forces of heaven. Adherents' nigh-polytheistic reverence for many biblical figures, emphasis of supernatural over textual authority, and integration of snake handling into ceremonies marks them as a distinct folk religion under little more than a veneer of Christianity."
 
 springsearcher:0 "Springsearcher"
 desc_springsearcher:0 "Born from the many myths and legends told in the unruly Floridian Peninsula, the Springsearchers tell stories of the hidden Fountain of Youth, said to grant immortality to any who find it. Those who do so become like the Immortal One and join Him in Paradise, where they fight against the embodiment of death and destruction, the Infernal Python. To earn the honor of locating the Fountain and the boon it brings, Springsearchers strive to truly live, emulating legendary figures such as Ponce DeLeon and Apollo Strongarm who discovered the Fountain and now guard against the dangerous gods of the untamed wilds."

 omenteller:0 "Omenteller"
 desc_omenteller:0 "Crawling out of the hills and hollers of the Appalachians, came the Omentellers. Their prophets spoke the culture, religion, legends, and history of the Appalachians into a new folk tradition. The creed places strong emphasis on fate, divine prophecy, and the fluidity of existence. This is in stark contrast to their animalistic pantheon, made up of enigmatic figures whose inscrutable wills must be determined through esoteric practices. Fate is tested by ceremonial handling of serpents, speaking in tongues, and the interpretation of divine apparitions. The foreboding shelter of their mountain homes acts as the greatest demonstration of the ominous wonder that the Omenteller faithful embrace through their religion."
 
 ophiolatry:0 "Ophiolatry"
 desc_ophiolatry:0 "Hatching from the brutal nest that was the Tyrant King's wondrous Desolation of the ancient empires of vice, slithered out the Ophiolatrists. Believing that Adam and Eve's original sin plunged humanity into a crude imitation of the pre-Fall Paradise, the faithful atone for this by recreating the splendid wonders of stone that once stood in the Garden of Eden. Atop these glorious structures, their priests deliver scorching condemnations of mankind's sin, punctuated by human sacrifices. They carry out these dreadful efforts to glorify their reptilian masters and advance the faith's mission to revive civilization as it was when the earth was young. Marked by literal interpretations of their eclectic oral and textual traditions, Ophiolatrists hope that the magnificent works and unshakable devotion that they have for their gods will earn them grace with the Serpent in the Wilderness when their sinful nature is inevitably judged."

 hearthtender:0 "Hearthtender"
 desc_hearthtender:0 "In the chaos of the tumultuous post-[the Event|Fall]] world, the ties of family are essential for survival. According to the Hearthtenders, it is women, particularly mothers, who the Father has chosen to keep these bonds of kinship sturdy against the onslaught of the Enemy. Empowered by the strength of the Feminine Spirit, it is the sacred duty of women to battle Evil after the inadequacy of man was laid naked. Yet, the faithful do not fight alone, for the Spirit has elevated various paragons of womanhood into angelic service, where they now take action on earth to help the righteous in their struggle to safeguard the Heavenly Family. This maternal fierceness is tempered by hospitality, because it is a woman's duty to both build and safeguard the hearth, so that there is always a home worth protecting."

 ## Lacustrine ##

 viking:0 "Tall Taler"
 desc_viking:0 "A pantheon of heroes of the American Old Northwest, these Tall Tales originated in oral stories and legends that have been passed down for hundreds of years. Heroes such as Paul Bunyan, Big Ole, The Green Giant, St. Urho, and others are worshipped in this faith. Tall Talers keep the spirit and memory of these long-gone heroes alive by telling stories about them. To Tall-Talers, a story is a sacred act, a communion with the other world. Tall Taler communities often incorporate other religious practices alongside their own- to the Tall-Taler, there  is often little distinction between  Lutheran, Catholic, , and Twainist practices, and their own."
 
 lakeshore:0 "Lacustrine"
 desc_lakeshore:0 "Along the shores of the Great Lakes, from the decimation of the Event, emerged the Lacustrine traditions. They combine local folklore and tall tales, viewing fluidity as the central concept binding their practices together, like the eternal, but ever changing waves upon a beach. For as long as water and blood flow in a neverending cycle, so too shall time."
 
 ## Atlantean ##
 
 egyptology:0 "Egyptology"
 desc_egyptology:0 "The fall of the great Atlantis, while tragic, did leave behind an heir to their civilization which would become a rival to their profound majesty and heavily influence the progress of the Americas. This society was Egypt. This lost nation serves as the spiritual basis for the Egyptologists, who seek to regain its cosmic power and to recreate their grand pyramids. The movement focuses its worship around the sun god Ra's divine knowledge and destinies which He and other celestial beings have given to humanity across history, attempting to use this enlightenment to act as stewards of Egypt's legacy. The faithful also try to decode the scriptures of other religions, unlocking hidden meanings and revealing the truth that Egyptian civilization is actually the root of all cultures and faiths across the world. Once the truth of Egyptian ascendancy is revealed, a new age of spiritual and technological mastery will begin again"

 ozymandism:0 "Ozymandian"
 desc_ozymandism:0 "Across dusty stretches of the Midwest, the hopes for a brighter future shine brilliant green. In the wake of the collapse of both previous attempts at reaching perfection, the Land of Oz and antique America respectively, the Ozymandians defy probability and dream of finally attaining Utopia. The faithful believe that every glorious society is guided by a collection of spiritual principles and celestial forces known as Oz, and that by internalizing the meaning of these concepts a people can be guided in building Utopia on Earth. This sweeping vision involves not only the equality of men and women, but also the shared harmony of all in society. Believers refuse to integrate with the unguided nations, although they have no qualms with bringing the power of Civilization against Barbarism when it is deemed necessary. To the Ozymandians, there is no cost or adversity too great to prevent the creation of their true emerald Utopia."

 theosophy:0 "Theosophy"
 desc_theosophy:0 "Theosophists posit a 'secret religion' at the heart of all religious traditions which has persisted through a line of Mahatmas, or Masters of Ancient Wisdom. These Masters live in high, isolated peaks where they protect secret wisdom regarding the ultimate truth of the universe. Theosophists hold that humanity is the fifth in a kalpic cycle of species that evolve spiritually, obtaining new senses with each evolution. Humanity, while more spiritually advanced than its predecessors, is not the culmination, but the one link in a chain. Helping educate humanity and guiding them to their spiritual apotheosis is the pre-enlightened World Teacher, the Maitreya."

 quetzaltec:0 "Quetzaltec"
 desc_quetzaltec:0 "Arising from the subterranean Chicomóztoc, the civilization of Aztlán prospered until it fell during the First Ruination, ending the age of the Fourth Sun, and forcing Quetzalcóatl to flee across the sea with his few remaining subjects, where he founded the Aztec Empire. There, he established the Toltecayotl to ensure the survival of his people's knowledge, however this did not last, as the Second Ruination brought forth the end of the Fifth Sun in an epic confrontation. With the dawn of the Sixth Sun, the Order of Quetzalcóatl still worships their namesake god, as well as the other Aztec deities alongside him. The destiny of the faith is to restore the advanced Aztec Empire and the ancient Toltecayotl wisdom, thereby freeing the Sixth Root Race, la Raza Cósmica."

 ## Veteranic ##
 
 veteranic:0 "Veteranic"
 desc_veteranic:0 "The world was cast in an endless war of horror, The War to End All, there were terrible people on all sides, a war fought by greed and malus. Brought on by the slow corruption by the Tempter, and helped along by The Omnipotent, Omnipresent, Reaper of Flanders and his Horsemen. A war that had been building since the Original Sin itself, when Cain struck down Abel in a fit of rage, and man first split his kin's blood.\n\nBut in this endless sea of horror, young men dying and spilling their blood in every corner of the earth, came a figure. The Unknown Saviour, the coming of the Trinity in one form upon the earth. Unlike the first coming however there was no great following in his life. Christ would die surrounded by fellow men, yet at the same time unknown. In No-Man's Land he fell, slain by an unknown Hun after he was ordered with his fellow soldiers to go over the top. As Christ's blood ran into the soil the first Poppies burst forth from the earth. His individual death was not known, was not heralded. But as God lay dying in the mud, the Holy Sprit left his body and entered the souls of every soldier on one side of the great and terrible war, blessing them, and granting them the holy knowledge that they must end this war. Not to win glory, but to save mankind.\n\nAs the soldiers of God's Entente pushed forward through hell, backed by mighty figures like the Angel of Vimy and mighty sea-bound Aichemes, the Tempters own puppets the Kaisers, Kaiser Attila, Kaiser Wilhelm, and Kaiser Hitler, sent the downtrodden and poor Huns to fight on their behalf. But no matter the innocence of the individual soldier, the forces of the Allies of Christ knew they must end this war, against the Kaisers, they must push against the Horsemen of the Omnipotent Reaper of Flanders, Conquest, War, Pestilence, and Famine, with the Horsemen of the Unknown Saviour, Peace, Prosperity, Progress, and Plenty, they must above all fight against Tyranny and Evil."

 ## Occultist ##

 fathomless:0 "Fathomless"
 desc_fathomless:0 "Along the mist-sprayed, rocky shores of New England, the followers of Fathomless Occultery believe they keep the fragile equilibrium of the world in balance. They stand as guardians, shrouded in the cold, dark aura that echoes the desolate whispers of a forsaken enlightenment. The Deep Ones, beckoned by the recklessness of the Old World's so-called Great Awakening, destroyed the Old World that forsook the ancient safeguards, leaving the pitiful few who tended to the Lights to seek refuge on these shores. The faithful's aversion to outsiders and their ideas serves as a crucial linchpin in maintaining the delicate balance of the New World, for any lapse of vigilance may cause the Lights to falter, and the protective barrier that wards the Deep Ones will collapse to usher in an era of intractable madness, unending famine, and unfathomable terror that shall consume the New World."

 gothic:0 "Occultist"
 desc_gothic:0 "Occultists understand that the end of the antediluvian world came not from mankind's hubris, or the fulfillment of ancient prophecies. Rather, the Event was made manifest by the actions of the Old Gods, vast forces with various names that move with unknowable and uncaring purpose. The Occultists cope with the machinations of these incomprehensible beings in differing ways, but none among them deny that humanity lives underneath enormously powerful entities which are incapable of mustering any feeling towards something as tiny as mankind. The only path to survival in a world such as this is to first understand just how insignificant people are within it."

 ## Woodlands ##

 midewiwin:0 "Midewiwin"
 desc_midewiwin:0 "Midewiwin, or the "Spiritual Mystery", is the traditional religion of many Native American groups in the Great Lakes area and beyond. Followers of Midewiwin believe that the Event, or the "Seventh Fire", marked the start of a new era for Native Americans across North America, a time for reclamation of both land and spirituality. The center of Midewiwin practice is the "medicine lodge", where initiated priests conduct rites of ceremony and passage for their people."
 
 gaiwiio:0 "Gai'wiio"
 desc_gaiwiio:0 "The Longhouse religion or Gai'wiio, meaning 'good message', was founded by the Seneca prophet Handsome Lake in 1799. Preaching a distinctive moral code which combined Christian Quaker values with traditional practices, the faith spread gradually among the Haudenosaunee peoples, at one point comprising nearly half of the group before the Event. Twice a year, the Gai'wiio is publicly proclaimed in an elaborate ceremony resembling Christian revival meetings."

 ## Peyotist ##

 peyotist:0 "Peyotist"
 desc_peyotist:0 "The Peyotists worship the teachings of Jesus and the Church alongside many different native beliefs, blending them together. Central to their practices is the use of the drug Peyote, used during a sacred ceremony."
 
 ## Trailwalker ##

 loneranger:0 "Trailwalker"
 desc_loneranger:0 "Emerging from the continuous mystification of old American and Indigenous customs, laws and local traditions, the Trailwalkers are a group of polytheistic creeds worshiping a myriad of pantheons united by a set core of beliefs, chiefly the dualistic composition of reality - the material Range, the world of everyday life, and the mystical Frontier, a realm where deities and the supernatural mingle. Snaking out from the Frontier are the Trails - a mixture of time-honored codes of ethics and moral teachings based on concepts such as the Red Road or the Code of the West that serve as guiding compasses to individual Trailwalkers seeking a meaningful and fulfilled existence on their sojourn through the Range."

 real_roader:0 "Real Roader"
 desc_real_roader:0 "Deeply rooted in the folklore and traditions of the Great Plains, the Real Roaders follow the pantheon known as the Great Council and the moral guidelines they established after the Pioneer families followed the eponymous Real Road to settle in the Range, the material world. As set out by the Great Spirit of the West himself, in order to return to the Frontier, practitioners must follow the orthodox Trails represented by the challenges Iron Horse and Silent Spike overcame in the creation of the Real Road. Those who retread the path their ancestors took with honor will, after death, be able to join the Great Council in their esteemed Homestead. As a result, Real Roaders place great emphasis on the sanctity and preservation of tradition, as it is the key by which they might find a divine destination beyond mortal existence."

 rivertracer:0 "Rivertracer"
 desc_rivertracer:0 "According to the old northern legends of the Rivertracers, the almighty Living Sky created the earth and brought warmth and song to humanity. But the Frost came and covered the land in cold and ice, pushing the Living Sky into the heavens, beginning the cycle of summer and winter. In the wake of this great battle, the Living Sky's tears fell and formed the Portages, the last vestiges of its material form, to lead man back towards it. With great loads sashed to their backs they explore all the lands under the Living Sky, seeking the mysteries of hidden tributaries and enlightenment through their laborious travels. Inevitably, the great cycles ebb and flow, the Living Sky wanes and the Frost waxes, and those paths leading to the Living Sky are frozen for a time. Yet those who are patient will see them opened once more to be followed, and those who are faithful will cross the Northwest Passage where they shall dance forever with the auroras."

 ## Quantum ##
 atomicist:0 "Atomicist"
 desc_atomicist:0 "Atomicists believe that Atomos's blessings are great and bountiful, and that humans may interact with him through the Elements, his aspects. Atomicists believe in a ritual called 'the blessing of the atom', in which they call Atomos upon their newborns in the form of his many emanations, Plutonis, Uranus, or Radia. By harnessing the hidden world of Atomos, an Atomicist may achieve enlightenment and may discover the truths of the world we live in."
 
 aphite:0 "Aphite"
 desc_aphite:0 ""Whilst Atomicists believe Atomos is behind everything, Aphites believe that Atomos is a flawed deity with many aspects that have their own independent power. Whilst possessing a hierarchical church structure that is said to have stemmed 'from the Old World itself', Aphites are known for their increased zeal and societal strictness in adhering to their plan. They are known to view Atomos's aspects as gods, omitting the radiant figures of Radia, Plutonis, and Uranus from the Pantheon in favor of Plumbus and Graphis."

 fissionist:0 "Fissionist"
 desc_fissionist:0 "During the Gilded Age, the corrupt Robber Barons ruled the world through the power of Industry. The Barons' tyranny was challenged when Prometheus discovered and taught the people to harness Fission, the strongest force of Atomos. Although the Barons killed Prometheus for his betrayal, his disciples became the first Scientists, and overthrew the Barons. This ended the dominance of Industry and ushered in the prosperous Atomic Age, made possible by the holy engines - Reactors that disseminated Fission's unlimited power to the people. However, distrust of the power of Fission led to many Reactors being destroyed, causing the end of the Atomic Age, directly leading to the world's end. Fissionists seek to recover the old knowledge of Prometheus by scouring the dormant remnants of the Reactors to one day power the world with Fission's unlimited potential once more."

 ## Seasprayer ##
 fogsong:0 "Fogsong"
 desc_fogsong:0 "The Fogsongs tell of Brother Jack, the defender of humanity and his sacrifice long ago. During the Moratorium; when the seas were empty and the fishermen starved, Jack sought a resolution. He was told by Father Patrick what he must do, and jumped into the ocean. There he transformed into a great whale, and from his maw flowed all the life of the seas. The seas were rejuvenated - but humanity, no longer under the protection of Brother Jack, fell into chaos. The Fairies and Spirits returned to the lands of man, wreaking magical havoc and trickery upon them. The Fogsingers still remember the sacrifice of Jack to sustain them, but now they must contend against those from the Otherworld."

 mervivant:0 "Mervivant"
 desc_mervivant:0 "Shaped by the chilly winds that carry along the Gulf of St. Lawrence, the Cycle of Merivivant worships the life given to them by all-supreme God, the Living Water, who brings life to His children with assistance from the shining light of le Radieux Beasoleil. Possessing a communal memory of their legendary expulsion from Acadia, le Grand Derangement, the faithful were kept alive by the Living Water. During the forty years of this forced Exodus, they were guided to their current home by the loving light of le Radieux Beasoleil while they floated adrift at sea. Even after surviving the expulsion, the harsh winters and scarcity of the post-Deluge world has only reinforced the connection that the Merivivant have to their beliefs, making their shared struggles the core of the faith's identity. Central to the group's understanding of their community since the expulsion are traditions of celebrations and songs, in which they honor and celebrate the accomplishments of holy figures, including saints, legendary heroes, angels, and above all the triune Living Water."

 ## Guruist ##
 guruist:0 "Guruist"
 desc_guruist:0 "Created by the first post-Event Emperor of California, Elton the Lawgiver, Guruism unifies the diverse expressions of spirituality, philosophy, and religion of the earth by revealing their underlying oneness and Californian character. Officially, the movement is stewarded only by the office of the Eternal Living Guru, a position deeply intertwined with Imperial governance and the office of the Golden Emperor itself, with all spiritual and temporal concerns of California existing in absolute harmony beneath its majesty. In reality, there are many dissenting sects opposed to the Imperial mainstream who assert their own interpretations of the Lawgiver's message, often through violent means."
 
 ## Naturalist ##
 gaian:0 "Gaian"
 desc_gaian:0 "Gaianism is an eclectic movement centered around the worship of Mother Gaia and her consort, the Horned God. Beliefs and personal spiritual practices may vary from community to community, but a shared set of ritual practices and spiritual organization bind the Gaians together. Dominating society are the Dryads, a mystical and secretive all-female caste which make up the Gaian priesthood. Gaians place special emphasis on Nature, viewing it as the purest manifestation of divinity."

 ## Latter Day Saints ##
 mormon:0 "Mormon"
 desc_mormon:0 "The Church of Jesus Christ of Latter Day Saints, also known simply as the LDS Church or Mormons, is historically the dominant branch of the LDS movement. The Church's theology centers around the Plan of Salvation, by which they believe Christ set a path to live as part of an eternal family with God after death, through performing good works and sacred ordinances. Largely rooted in the Rocky Mountains, far from the Midwestern communities of Smith's time, the LDS have seen a new era of political independence after the Event. Drawing on the ancient republican ideals of the Americas, known through law and scripture, the Church has built a new Theodemocracy - the code to which the old LDS strongholds and their nobility are held - to guide the faithful's political ascent."

 ## Scientology ##
 scientology:0 "Scientology"
 desc_scientology:0 "placeholder mcgee"

 ## Kinemite ##
 kinemite:0 "Kinemite"
 desc_kinemite:0 "placeholder mcgee"

 ## Romano-Humanism ##
 romano_humanism:0 "Romano-Humanism" 
 desc_romano_humanism:0 "The Romano-Humanists dedicate themselves to the pursuit of knowledge from before the Event. Drawing from a diverse array of pre-Event schools, the Romano-Humanists see themselves as heirs to the intellectual legacy of the Old World. Operating through mystery cults within the universities of the West Coast, the Romano-Humanists bear the Twin Torches of Wisdom and Passion in darkness. Seeking the enlightened few capable of passionate study and wise application of knowledge, only the initiated few can restore virtue in a decayed world. Each cult has its own approach to bearing the Twin Torches, but all are united in the goal of restoring the world through human virtue and enlightenment."

 ## Sikhism ##
 sikhism:0 "Sikhi"
 desc_sikhism:0 "Sikhi is a faith from ancient lands across the ocean. The faithful worship the supreme god, Wahe Guru, who is both a creator and within everything. Sikhs follow the ten Gurus and the eternal Guru, the book called the Guru Granth Sahib, which gives praise to Wahe Guru in his many names and lays out the way of life for a Khalsapanthi. To a Sikh, it is not simply belief that defines their religion, but practice. All Sikh men wear their hair uncut, carry a comb and a sword, and wear an iron bracelet and turban. Furthermore, they all follow the four provisions which state that they must not cut their hair, use intoxicants, eat slow-bled meat, or commit adultery. By doing these things, living a pious life in praise of Wahe Guru, and then meditating on his mystery, Sikhs believe they will be united with him."

 ## Northwestern ##
 dreamer:0 "Dreamer"
 desc_dreamer:0 "The Dreamers encompass the traditional beliefs of much of the interior Northwest. Over time, their beliefs have evolved while still retaining major core elements, including respect for the natural world and the spiritual power of dreams. Prophetic dreamers, such as the ancient Smohalla, serve an important role in introducing and recodifying rituals and stories for new generations. Adherents place great importance on honoring traditional ways of life, as well as the spiritual link between humanity and the creatures and plants Mother Earth has provided, and the other spirits of the land."
 
 raven_tales:0 "Raven Tales"
 desc_raven_tales:0 "Followers of the Raven Tales revere supernatural beings described in their sacred stories, Raven foremost among them. In some tales Raven is playful and benevolent, while in others he is greedy, treacherous, and wanton. He is sometimes loved and sometimes feared. Raven indirectly made the world by stealing and transforming that which came before, and preserved the Haida though the Dark Times with cleverness and trickery. Other Xhúuyee K'iigaang gods include Ta'xet and Tia, who rule over violent and peaceful death respectively."

 ## Astronomer ##
 zetanologist:0 "Zetanologist"
 desc_zetanologist:0 "According to Zetanology, humanity lives in the aftermath of a major battle against their alien creators, the evil Annunaki. Earth, now vulnerable to another attack from its foes, is in need of constant defense. This is done by complicated rituals, often involving the construction of glyphs, be they homemade weavings or imposing megaliths, to act as signals and bases for the various extraterrestrial allies which support mankind in their war against the Annunaki. Psychic warfare is even utilized, with humans ascending to higher planes of existence via meditation to engage in mental combat. The extensive number of aliens which influence Earth, good, bad, or somewhere between, dominate Zetanologist life, acting as a point of constant consideration."

 ## Spiritualist ##
 clairvoyant:0 "Clairvoyant"
 desc_clairvoyant:0 "Death is not the end - or, at least, according to the Clairvoyants' Association it is not. Finding its roots in pre-Event movements that sought to commune with the spirits of those who have passed from this world, those with the gifts of Second Sight use various methods, usually the Major Arcana, to channel the wisdom gleaned from spirit guides. These guides are the spirits who have in their afterlife come back to assist mortals, often their still living family members. While the spirits themselves may communicate with the living through dreams, sounds, or direct physical manifestation, it is the role of gifted mediums to interpret the supernatural signals to provide guidance and advice for the living. Taking this insight with an open and inquisitive mind, Clairvoyants seek to abolish the arbitrary boundary of death."
 transcendentalist:0 "Transcendentalist"
 desc_transcendentalist:0 "Basing itself upon the writings of pre-Event luminaries such as Emerson, Thoreau, and Fuller, the Transcendental Club and the movement it takes its name from elevates individualism as its core spiritual pillar. Society, the compacts and coercions which govern man, keeps people from connecting with the spirituality of nature and everyday living. Unlike other esoteric traditions, Transcendentalists do not believe the divine is locked away from reach - it is present in the woods, waters, and mountains of the living world, but man-made rules blind us to its divinity. In order to find this divinity, Transcendentalists regularly strike out on their own and live within nature, coming together primarily to share their insights and help one another in their journey to self-reliance." 

 ## Midwestern ##
 twainist:0 "Twainist"
 desc_twainist:0 "The Twainists view the Mississippi and her tributaries as the soul and lifeblood of America, and to a greater extent the world. Twain, Muir, Whitman and other Authors were guided with knowledge that allowed them to ascertain the nature of the Great River, granting them divine insight. Twainist belief divides the world into three ages - the Age of Cahokia, dominated by the philospher-king Cahokia and his great mounds, the Age of Uncle Sam, in which Old America was borne in, and fell due to her warmongering and imperialism, and the current Age of Columbia - who is the daughter of Uncle Sam, taking the place of her now dead uncle. Twainists dedicate their life to discovering the Great Truth that all Authors seemed to understand. It is commonly understood that the only way to do this is to further one's relationship with the Great River - Mississippi, and the coexistence between Man and Nature."
 missisippian:0 "Mississippian"
 desc_missisippian:0 "An ancient cult, once worshipped by the Natchez people, the Mississippians venerate the Great Sun King Louis, and his brother, Serpent Huey. Mississippians worship not only these gods, but Mother Mississippi - the Great River. Their stratified society is dominated by Kings of the Sun, or those who claim divine descent. Another central tenet is the burning of a perpetual flame, which is only extinguished once a year."

 ## Capitalist ##
 capitalist:0 "Decadentist"
 desc_capitalist:0 "Letting the good times roll, the Decadentists posit that The Free Market gains Capital not through moving wealth, but via the cultivation of pleasure. The faithful focus their worship towards a feminine sun goddess called Fortune, who distributes the blessings of the Free Market in proportion to the Capital a person has accrued so far in their life. However, the boons of Fortune are always given out by way of chance. To cope with the inherent randomness of Fortune's favor, Decadentists embrace the whims of their goddess and refuse to stay rooted in any single approach to life. Basking in the grace of their fickle mistress, the glory and exaltation which she can bestow are unrivaled, as are the times of hardship and scarcity she may enable. Just the same, the faithful bet on her."

 ## Universal ##
 unitarian_universialism:0 "Unitarian"
 desc_unitarian_universialism:0 "Unitarian Universalists assert no creed, but instead, are united behind a shared search for spiritual growth. Unitarians are guided by their 'living tradition' - that is, by a number of documents open to reading, reinterpretation and reworking. These various traditions give way to inspiration and insight taken from all religions, although special regard for intellectual freedom and inclusive love above other elements of theology."
 scottish_rite:0 "Scottish Rite"
 desc_scottish_rite:0 "As their full name would suggest, the Ancient and Accepted Scottish Rite is one of the oldest rites of Freemasonry present in the Americas. Consisting of 33 degrees, or ranks, the Scottish Rite has preserved many of the customs and rituals that other Masonic organizations across the continents have adapted with the progression of time, such as the requirement to profess belief in a Supreme Being, the presence of scripture of some kind at meetings, and a total ban on discussion of politics within the walls of their lodges. Each of the degrees embodies a teaching within the broader philosophy of the Masonic Lodge, weaving together into a dramatic retelling of the story of King Solomon's Temple. As Masonic ritual contains the physical processes of building the temple, the degrees contain the spiritual processes of self-improvement, building the person."
 bahai:0 "Baha'i"
 desc_bahai:0 "The Deluge did not spare the Baha'i community, and the already spread out religion was cut off from its homeland in the far east. Despite this, there has been very little deviation from the Tablets of Bahá'u'lláh, which preach for a world united in peace and justice. The Baha'i believe that this unity has been dealt out piecemeal by God, who revealed it to various prophets and divine teachers over the centuries. As a result, the Baha'i abhor religious violence and promote a tolerant, pacifistic lifestyle that continues to persist into the 27th century."
 ## Reawakened ##
 rosicrucian:0 "Rosicrucian"
 desc_rosicrucian:0 "The Rosicrucian Orders are a collection of secretive organizations claiming lineage from an eclectic and esoteric sect of Old Europe's Christendom, which in turn claimed lineage from alchemical mystics from the time of Jesus and even before. Theologically the Rosicrucians all believe that the material world is an emanation from a divine being called the Absolute, who is incomprehensible to mortal minds. The goal of life is to achieve spiritual evolution along the Seven Worlds Within God, until eventually reuniting with God as the Emanation of the Absolute. Rosicrucians believe this can be achieved through spiritual awakening, which is the result of attaining mystical knowledge and training. Today the sect as a whole exists at the outskirts of Christianity in general, with some various outposts of fellowships remaining in some storied lodges across the Americas."

 ## Plains ##
 sun_dance:0 "Sun Dance"
 desc_sun_dance:0 "The Sun Dance is the central ritual of the Plains religious complex, a yearly event where all ancestors and spirits are believed to participate alongside the living. The ceremony opens with the dreams and visions of the presiding medicine people, continuing in earnest with ritual piercing and suspension followed by a constant dance for the next four days. Food and water are abstained from by the dancers in a feat of strength and endurance, reinforcing tribal ethics of selflessness, bravery, and tenacity. The acts of self-mortification and dancing empower the whole tribe, as the dancers give of themselves to appease the spirits and thank their creator. Additionally, bison skin and bones are used on the central pole to honor the bison and the creator, who may bestow fortune or blessings upon the tribe."

 ## Islamic ##
 sunni:0 "Sunni"
 desc_sunni:0 ""
 
 ahl_al_qibla:0 "Ahl Al Qibla"
 desc_ahl_al_qibla:0 "In the wake of the Event, under threat of being wiped out in the face of an increasingly religiously intolerant society, various imams of the Great Lakes met in Toronto to create a united front to represent all of the religion. Taking its name from the practice all Muslims share - bowing towards Islam's holiest location, the Kaaba - Ahl al-Qibla gradually coalesced into a single united denomination over the centuries. Synthesizing both Shia and Sunni traditions, the faithful often emphasize the connections all religions and people have with Allah, even those outside the faith, a practice that lends itself to conversion efforts. As a result, the Ahl al-Qibla sect is among the most prevalent forms of Islam in North America."

 shriner:0 "Shriner"
 desc_shriner:0 "The Order of the Mystic Shrine originates from a society of nobles that held influence throughout many cities in antediluvian America. Adopting the trappings of rulers from far off lands and using similar titles in their organization, they were wholly committed to charitable work and giving to their communities. When the Event came and shattered society, the Order's commitment to charity and community did not change. The Shriners subsequently took on a leadership role in the communities they held the most sway in, gaining respect and reverence among the people. As they grew, the Shriners embraced the symbols and titles they once used merely out of tradition as their new identity. From this evolution, a cosmopolitan and exotic form of Islam began to take shape. The Order of the Mystic Shrine accepts anyone who is willing to devote themselves to charity and the teachings of the Prophet, often garnering respect of both unbelieving rulers and masses alike due to their noble commitments."

 twelver:0 "Twelver"
 desc_twelver:0 "The Ithna'Ashariyya, or the Twelvers, follow the teachings of Prophet Muhammad as preserved by the Twelve Imams from his family. The pre-Event Twelvers have long organized themselves in secret, underground communities to avoid persecution. As religious minorities often face such conditions in the modern day, the faithful find themselves in a similar predicament to their ancient ancestors. The Twelver communities across the Americas often go unnoticed, hidden by the practice of Taqiyya: the concealment of belief in the face of danger."

 ## Platinean ##
 platinean:0 "Platinean"
 desc_platinean:0 "The Hero-cults of the Pampas believe that the world is a great competition. Since time immemorial, the mythic Heroes have jostled amongst each other in the The Competencia Mundial in order to be crowned as the Man of Destiny and rule over the United Provinces. Since they were banished from the mortal world for causing The Calamity, they instead select mortal champions, their Chosen Competitor, to act in their stead and achieve victory for their patron. Though the Hero-cults may differ on questions of doctrine or theology, the rules of the Competencia Mundial are quite clear - secure fame and glory in your lifetime, and you may be chosen by the Hand of God to win."
 
 ## Festivalist ##
 parodia:0 "Parodia"
 desc_parodia:0 "Originating within the rich Platinean musical traditions of Murga and Candombe, the followers of the god Momo believe that the world was sung into being by a divine chorus created by their slumbering deity to cure his loneliness in the primordial night. They pursue joy and mockery as the path to a righteous life, finding happiness in life's absurdities while wielding laughter as a weapon against oppression. Their rituals blend satire and reverence through elaborate street performances, where masked celebrants don colorful costumes and perform songs and dances meant to honor Momo and his divine court. The faith reaches its peak during the sacred Carnaval season, when Momo briefly awakens from his eternal slumber to witness the joyous tributes of his people."

 vendimia_sol:0 "Vendimia Sol"
 desc_vendimia_sol:0 "Evolving from the harvest festivals of western Argentina, the worshipers of the Sun, beauty and the ecstatic hedonism of Dionysian-esque rituals have carved themselves a unique niche in the spiritual landscape of the Southern Cone. An all-female priesthood, said to be the brides of the Sun, serves as the organizer and host of great banquets meant to celebrate his gifts. However, centuries of vilification and persecution by both Anachronists and Christians have given this faith a deeply fundamentalist outlook, believing themselves to be the last ones chosen by the Sun himself."

 ## Jewish ##
 haredi:0 "Haredi"
 desc_haredi:0 "Haredim are the successors of the most traditional pre-Event communities, who banded together and accepted many other Jews into their ranks during the chaos after the Event. Although there is a great deal of diversity in Haredi religious practice, they are united in their anticipation of Moshiach, or the Jewish Messiah. Haredim believe that Moshiach's arrival will be accompanied by the return of the Jewish people to Eretz Yisrael and the ushering in of peace on earth. In the meantime, Haredim fastidiously study and adhere to Halakha, or Jewish religious law, believing that this will facilitate Moshiach's imminent arrival. Haredim are notable for their tendency to limit participation with the culture of outsiders, although they do not go out of their way to antagonize non-Jews or otherwise interfere with their lives."

 ## Buddhism ##
 shambhalaism:0 "Shambhalaism"
 desc_shambhalaism:0 ""Brought down from the astral plane of Shambhala to the mountains of Tibet, then across oceans to the Americas, the ancient tradition of Shambhalaism has found purchase in the Rocky Mountains. Members of the sect await the imminent return of the Maitreya from Shambhala, who will triumph over the Asuras to usher in a new age of peace. The most important preparation is of the soul, primarily done through mediations which affirm the innate goodness of all human beings. In addition, the faithful attempt to create an enlightened and powerful society, one composed entirely of "spirit-warriors". Until the coming of the Maitreya, humans will be unable to reach their ultimate form as Dharmapalas, though those that are strong enough will ascend to Shambhala in order to join the armies of the Maitreya instead of reincarnating. However, while on Earth, followers are encouraged to not pursue violence, rather be ready to stand strong against it in whatever form it may take."

