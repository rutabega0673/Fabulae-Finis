l_english:
 ff_treasure_little_red_book:0 "Quotations From a Revolutionary"
 ff_treasure_little_red_book_desc:0 "This little red book contains many famous quotations and speeches from a famous Revolutionary, who lived across the sea. Its mantras are a famous among the peasants of California."
 ff_treasure_itliongs_horn:0 "Itliong's Horn"
 ff_treasure_itliongs_horn_desc:0 "The horn of the Harvest Marshal, Goyo Itliong, the sharp bellow heard from this horn inspires the frontline soldiers to give their life to the revolution. Viva el Legislador! Viva el Jardin Dorado!"
 ff_treasure_tomcat_medal:0 "Tomcat's Medal"
 ff_treasure_tomcat_medal_desc:0 "Given from Elton to Sabre Tomcat, another Caesarist general who defected, siding with Elton and his righteous revolution."
 ff_treasure_platos_republic:0 "Plato's Republic"
 ff_treasure_platos_republic_desc:0 "Written by Plato, perhaps the most famous of all Greek Philosophers, the Republic outlines Plato ideal system of governance, and how society out to be ruled by a class of 'Philosopher-Kings'. After all, the crowd is much too fickle."
 ff_treasure_meditations:0 "Meditations"
 ff_treasure_meditations_desc:0 "Marcus Aurelius' Meditations ruminates on the importance of analyzing one's judgment of self and others and developing a cosmic perspective, and finding your place in the universe."
 ff_treasure_bear_flag_banner:0 "Bear Flag Banner"
 ff_treasure_bear_flag_banner_desc:0 "Emblazoned with the distinctive Californian bear, this tattered pre-event example is still a symbol of unity and pride for the peoples of California."
 
