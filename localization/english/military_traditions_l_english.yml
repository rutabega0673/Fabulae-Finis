 anatolian_philosophy_desc:0 "Describe"
 anatolian_philosophy_2:0 "Upland Military Traditions"
 anatolian_philosophy_2_desc:0 "Describe"

 #Lydo-Cilician Tree
 lydian_path_1:0 "Roll Tide"
 lydian_path_1_desc:0 "The fearsome war cry of the Alabamans is often heard, as their red-painted ships approach enemy shores."
 lydian_path_2:0 "Straw Hats"
 lydian_path_2_desc:0 "The Straw Hat symbolizes freedom, and originated in the Deep South."
 lydian_path_3:0 "Caribbean Pirates"
 lydian_path_3_desc:0 "The rich ports of Florida, Texas, and Louisiana are frequented by pirates, where they are notorious there."
 lydian_path_4:0 "Light of Foot"
 lydian_path_4_desc:0 "Lightly armored units can move faster and prepare their equipment and scout the terrain out. This makes them excellent skirmishers."
 lydian_path_5:0 "The Playbook"
 lydian_path_5_desc:0 "Southern commanders are taught strategy via the ancient and revered game of Football. The plays learned from this game teach quick thinking and other important skills to have on a battlefield."
 lydian_path_6:0 "QB Blitz"
 lydian_path_6_desc:0 "Sometimes you only have men and no equipment, but quantity is a quality of its own."
 lydian_path_7:0 "Military Administration"
 lydian_path_7_desc:0 "To efficiently function, one must be efficiently organized. The military is always efficient."
 lydian_path_8:0 "Esprit de Corps"
 lydian_path_8_desc:0 "A common goal is always important. It reduces dissent."
 lydian_path_9:0 "The Fortunes of Vanderbilt"
 lydian_path_9_desc:0 "Vanderbilt was a famous billionaire and philanthropist in pre-Event times. His fabulous mansion still stands, a testament to his prosperity. A wise ruler would seek to emulate his wealth."
 lydian_path_10:0 "The Bowie Knife"
 lydian_path_10_desc:0 "Originating in Texas but becoming ubiquitous among all southern cultures was the Bowie Knife, an inexpensive large knife, useful as a weapon and a tool alike. Because of this, every levied soldier has at least one decent weapon."
 lydian_path_11:0 "Appalachian Archers"
 lydian_path_11_desc:0 "Appalachia's hills gave rise to much wild game that many envied. Useful in times of peace and war alike, the bow isn't to be underestimated."
 lydian_path_12:0 "Masters of the Mississippi"
 lydian_path_12_desc:0 "The Mississippi was a great trade hub that supplied many with grain and other goods. Control of any portion of the river made one extremely wealthy."
 lydian_path_13:0 "Lords of the Caribbean"
 lydian_path_13_desc:0 "The Caribbean was much of the known world. Ruling over it was akin to being the Ruler of the World."
 lydian_path_14:0 "Military Academies"
 lydian_path_14_desc:0 "Sons of Southern nobles were expected to attend Military Academies, where they were instructed not only in the art of war, but how to be a proper Southern gentlemen. West Point was the most famous of these."
 southern_path_1:0 "Southern Knights"
 southern_path_1_desc:0 "Chivalry and bravery are important virtues to Southerners. Even warriors must be gentlemanly."
 southern_path_2:0 "The Piedmont"
 southern_path_2_desc:0 "Perhaps the most distinctive feature of the upper South is the Piedmont, a vast tract of fertile plains, stretching from South Carolina to Virginia."
 southern_path_3:0 "Mardi Gras Riders"
 southern_path_3_desc:0 "The Louisianais cavalry, adorned in garish gold, green and purple strike fear into the heart of any at the end of their spear."

 #Armeno-Pontic Tree
 armenian_path_1:0 "Equestrian Culture"
 armenian_path_1_desc:0 "In North America, the horse must be the most important animal in war. Some even dedicated their entire culture to it."
 armenian_path_2:0 "Kentuckian Horse Breeding"
 armenian_path_2_desc:0 "The Kentuckian Thouroughbreds are among the most important horse breeds for war."
 armenian_path_3:0 "Kentuckian Scouts"
 armenian_path_3_desc:0 "In Kentucky, you don't scout ahead; the Kentuckian scout finds you."
 armenian_path_4:0 "Royal Bodyguards"
 armenian_path_4_desc:0 "Any King pretending to that title must impress visitors with his guard. Oh, and sometimes they can save him too."
 armenian_path_5:0 "Urban Development"
 armenian_path_5_desc:0 "The South is ripe with places for prosperous cities, from the Piedmont, to the Delta and beyond."
 armenian_path_6:0 "Riding Schools"
 armenian_path_6_desc:0 "Many enjoy riding in their free time. It is a useful skill to have in both war and peace."
 armenian_path_7:0 "Mountain Hollers"
 armenian_path_7_desc:0 "Appalachian tribes often live with their extended family units in 'Hollers', small valleys nestled in the Appalachian Mountains. These Hollers are easily defensible, and "
 armenian_path_8:0 "Extended Kin Networks"
 armenian_path_8_desc:0 "Blood is thicker than water; to help your kin is to help yourself."
 armenian_path_9:0 "Butternutter Spearmen"
 armenian_path_9_desc:0 "The Butternutters have adopted the Steelfolk Picket Line, but equipping their spearmen in a lighter manner."
 armenian_path_10:0 "Old American Traditions"
 armenian_path_10_desc:0 "The Old Americans were once the mightiest warriors in the world. Now all that remains is the distant memory of their traditions."
 armenian_path_11:0 "Warriors of God"
 armenian_path_11_desc:0 "Before battle, Upland warriors are often blessed by a priest. Their unwavering belief in the Almighty strengthens the resolve of soldiers."
 armenian_path_12:0 "Kentucky Derby"
 armenian_path_12_desc:0 "The most prestigious of Uplander horsemen compete yearly in the Kentucky Derby, a horse race that has been going on since pre-Event times."
 armenian_path_13:0 "Hill Riders"
 armenian_path_13_desc:0 "The Uplanders are no stranger to hills. Their cavalry are trained to be experts in hilly terrain."
 armenian_path_14:0 "Ozark Archery"
 armenian_path_14_desc:0 "None are better archers than the Ozarkians. Use of the bow is adopted at a young age, ensuring every child grows up with some knowledge of it."
 armenian_path_15:0 "Legacy of Daniel Boone"
 armenian_path_15_desc:0 "No Uplander is more well regarded than the legendary Daniel Boone, founder of the Kingdom of Kentucky, and defender of the Alamo."

 ###New Steppe Traditions###
 steppe_philosophy:0 "Great Plains Traditions"
 steppe_philosophy_desc:0 "."
 steppe_philosophy_2:0 "Midwestern Traditions"
 steppe_philosophy_2_desc:0 "."

 #Scythian Traditions

 scythian_path_1:0 "The Buffalo"
 scythian_path_1_desc:0 "The Buffalo is among the most versatile of animals. It can be used not only for meat, but to make saddles, teepees, medicine pouches, cups, ornaments, weapons, and for ceremonial purposes, to name a few."
 scythian_path_2:0 "Gunstock War Club"
 scythian_path_2_desc:0 "Inspired by the firearms of pre-Event times, Gunstock War Clubs take a similar shape, being simple, yet effective weapons of war."
 scythian_path_3:0 "Steppe Lancers"
 scythian_path_3_desc:0 "The steppe lancers were a feared unit with high penetrating power."
 scythian_path_4:0 "Plains Siege Techniques"
 scythian_path_4_desc:0 "The horse lords came up with new ways of besieging a city - a horse can't climb a wall after all."
 scythian_path_5:0 "Globular Formations"
 scythian_path_5_desc:0 "This formation enhanced the trained warrior's killing efficiency."
 scythian_path_6:0 "Badlands Warfare"
 scythian_path_6_desc:0 "The rough terrain of the South Dakotan Badlands has taught us many lessons in fighting in such a difficult land."
 scythian_path_7:0 "Counting Coup"
 scythian_path_7_desc:0 "Among the Plains Indians of North America, counting coup is the warrior tradition of winning prestige against an enemy in battle. It is one of the traditional ways of showing bravery in the face of an enemy and involves intimidating him, and, it is hoped, persuading him to admit defeat, without having to kill him. These victories may then be remembered, recorded, and recounted as part of the community's oral, written, or pictorial histories."
 scythian_path_8:0 "Horse Kneeling"
 scythian_path_8_desc:0 "The training and discipline required to teach a horse to kneel was immense, yet commonplace enough to make an impact in the formation of units."
 scythian_path_9:0 "Scaled Armor"
 scythian_path_9_desc:0 "Scaled armor protects even better than chain-mail; however, as a trade-off, it is less flexible."
 scythian_path_10:0 "Barbed Arrowheads"
 scythian_path_10_desc:0 "These arrows were particularly vicious and difficult to extract from the human body. They sit deep and well-rooted so that, if it was pulled out, a big piece of flesh came with it. Usually, it had to be cut out."
 scythian_path_11:0 "Stout Bow"
 scythian_path_11_desc:0 "This type of bow, designed for use on horseback and deadly, but only at short range, is the weapon of choice for many Great Plains tribes."
 scythian_path_12:0 "Plains Horsemanship"
 scythian_path_12_desc:0 "The Plains tribes learn their horsemanship from a young age, developing an affinity for it unlike any other culture. This knowledge can be put to good practical use when organizing our armies."
 scythian_path_13:0 "War Bonnet"
 scythian_path_13_desc:0 "Only the most worthy of chiefs recieve the honor of wearing a War Bonnet, a ceremonial piece of feathered headgear."
 scythian_path_14:0 "Masters of the Great Plains"
 scythian_path_14_desc:0 "We have mastered fighting in the Great Plains, something that can be matched by no other."

 #Bactrian Traditions

 bactrian_path_1:0 "Buzkashi"
 bactrian_path_1_desc:0 "'Goat pulling' is a sport in which players mounted on horses try to score a goal with the dead body of a goat or calf."
 bactrian_path_2:0 "Archery Drill"
 bactrian_path_2_desc:0 "Archers need training. The Heartlanders have developed some interesting exercises to shoot down any nuisance."
 bactrian_path_3:0 "Gatewayan Foot Warriors"
 bactrian_path_3_desc:0 "Sometimes even the horse loving cultures have to accept that a horse isn't the solution to everything."
 bactrian_path_4:0 "St. Louisian Spearmen"
 bactrian_path_4_desc:0 "While spearmen become less common the further west you go, St. Louis is known for her skilled spearmen, who are second to none."
 bactrian_path_5:0 "Peyote Rites"
 bactrian_path_5_desc:0 "Sacred to many Great Plains cultures, Peyote was used as a visionary and sacred sacrament, often used to commune with God and the spirits of the deceased."
 bactrian_path_6:0 "Poison-Tipped Arrows"
 bactrian_path_6_desc:0 "What a nasty surprise for any would-be invaders! Alexander can tell a story about them..."
 bactrian_path_7:0 "Legacy of Sitting Bull"
 bactrian_path_7_desc:0 "Sitting Bull was a great chief from the lands north of the Missouri River. Of Lakota origin, he successfully defended hiself against Custer's invasion, destroying his forces at the legendary Battle of Little Bighorn."
 bactrian_path_8:0 "Death from Above"
 bactrian_path_8_desc:0 "When used effectively, a mass of archers can destroy an oncoming cavalry charge on the open prairies before they even get close to the frontlines."
 bactrian_path_9:0 "Expert Foragers"
 bactrian_path_9_desc:0 "In extreme environments, unique skills develop. Here, the people never forgot how to feed themselves from the wild nature alone."
 bactrian_path_10:0 "Mountain Rangers"
 bactrian_path_10_desc:0 "These rangers lived and died in the Mountains we now know as the Rockies. They knew many small paths to surprise one's enemy."
 bactrian_path_11:0 "Tomahawk"
 bactrian_path_11_desc:0 "The Tomahawk was created by the Algonquian people. It quickly spread from the Algonquian culture to the tribes of the South and the Great Plains. A versatile axe, Tomahawks are used both as weapons of war, and tools of peace."
 bactrian_path_12:0 "River Cities"
 bactrian_path_12_desc:0 "All across the Midwest and Great Plains, many large and prosperous cities are fed by local rivers, which are the lifeblood of these settlements."
 bactrian_path_13:0 "Fortified Cities"
 bactrian_path_13_desc:0 "Along the harsh plains, one can stumble across the odd lonesome city, surrounded by ramshackle fortifications."
 bactrian_path_14:0 "Veteran Communities"
 bactrian_path_14_desc:0 "Our veterans teach the younger recruits, their experience mixing with the temperament of youth."
 bactrian_path_15:0 "The Interstate"
 bactrian_path_15_desc:0 "The Interstate was established by the Presidents of Old America. In the centuries post Event, it has begun to take on a more defined shape, becoming an important path for goods from California and Mexico, as they move eastward."
 midwestern_path_extra_1:0 "Gateway to the West"
 midwestern_path_extra_1_desc:0 "The great and storied city of St. Louis has stood as a grand gate to the west since time immemorial. Even now, hundreds of merchants, travelers, and wanderers seeking their fortune take the path westward daily, hoping to find their quarry."

 ###Germanic Traditions###
 germanic_philosophy:0 "Great Lakes Traditions"
 germanic_philosophy_desc:0 "Describe"
 germanic_philosophy_2:0 "Great Lakes Naval Traditions"
 germanic_philosophy_2_desc:0 "Describe"

 #Germanic Traditions
 germanic_path_1:0 "Northlake Archery"
 germanic_path_1_desc:0 "The bow has been a way of life, both a weapon and a tool since time immemorial. No peoples understand this better than the Anishinaabe and the Northlake."
 germanic_path_2:0 "Viking Raids"
 germanic_path_2_desc:0 "Perhaps inspired by their mythical ancestors, certain Northlake groups have taken to indiscriminate raiding of the Great Lakes, harassing the many urban centers that lay on her shores."
 germanic_path_3:0 "Forest Hunt"
 germanic_path_3_desc:0 "To hit a hare in the forest in times of peace makes for excellent training for war."
 germanic_path_4:0 "Forest of the North"
 germanic_path_4_desc:0 "The forests are so grand that one can fell countless trees without making an indent. Luckily, we can use those felled trees for bows."
 germanic_path_5:0 "Migration as Usual"
 germanic_path_5_desc:0 "The Northlake Tribes migrated all the time. For the longest of times, there was no region that was continually occupied by the same people."
 germanic_path_6:0 "Great Plains Herders"
 germanic_path_6_desc:0 "The southernmost Northlake tribes reside in the Great Plains, where they watch their flocks on the rolling grasslands. There they hunt for their food and build their settlements, relying on their skill with the bow to drive away interlopers."
 germanic_path_7:0 "The Canadian Shield"
 germanic_path_7_desc:0 "Far from the civilized lands of the south lay the dark forests of the Canadian Shield, a nigh impenetrable geographic formation. It is here where the peoples of the Great Lakes have made their home. Many an invader has lost their life in this foreign and treacherous land."
 germanic_path_8:0 "Steady Aim"
 germanic_path_8_desc:0 "The well-traveled archer learned the positioning for the best aim in difficult terrain. This time, the distraction of a falling rock won't cause him to miss!"
 germanic_path_9:0 "Legendary Leaders"
 germanic_path_9_desc:0 "Legendary leaders of yore are used an example for current rulers."
 germanic_path_10:0 "Strategic Placement of Forts"
 germanic_path_10_desc:0 "Whilst usually not settling, the Northlake tribes often fortified key natural positions to thwart any possible attack."
 germanic_path_11:0 "Mythical Figures"
 germanic_path_11_desc:0 "Central to the mythology of the Great Lakes are figures such as Paul Bunyan. Their lauded tales are still told today, inspiring the people."
 germanic_path_12:0 "Meritocratic Leadership"
 germanic_path_12_desc:0 "Like in the glorious past of old America, leaders are chosen not by birth or wealth, but by deed and virtue."
 germanic_path_13:0 "Forest Scouts"
 germanic_path_13_desc:0 "Northlake tribes often used cavalry to scout ahead. This increases mobility diminished the risk for an ambush."
 germanic_path_14:0 "Scourge of the Great Lakes"
 germanic_path_14_desc:0 "The Northlake tribes were notorious for their raids. Many of our enemies have suffered from them, but on the bright side, we now have more slaves!"
 germanic_path_15:0 "Practiced Farming"
 germanic_path_15_desc:0 "While most peoples of the Western Great Lakes have a relatively loose political organization, even the least sedentary of tribes practice farming, as it is such an ingrained practice in their society."
 germanic_path_16:0 "Urban Trade Centers"
 germanic_path_16_desc:0 "Even in pre-Event times, cities such as Duluth and Milwaukee were important centers of trade."
 germanic_path_17:0 "Old World Knowledge"
 germanic_path_17_desc:0 "Although that storied age has long since passed, scraps of knowledge can still be found in the ruins of pre-event universities, if one knows where to look."

 #Germanic Sea Traditions
 germanic_sea_path_1:0 "Roman Inspiration"
 germanic_sea_path_1_desc:0 "Inspired by the Roman boats and adding their own spin, the Germanic ships were devastating."
 germanic_sea_path_2:0 "Fast Oversea Raids"
 germanic_sea_path_2_desc:0 "To raid overseas you need a boat. To be able to raid more, you need to be faster."
 germanic_sea_path_3:0 "Overlapping Plates"
 germanic_sea_path_3_desc:0 "A Mid-Atlantic influence, this construction technique made the ships more resilient to damage and drowning."
 germanic_sea_path_4:0 "Great Laker Explorers"
 germanic_sea_path_4_desc:0 "Already early in their history, the Rangers, Yoopers, Shieldshorers and other tribes ventured on the lakes and rivers to search for new lands."
 germanic_sea_path_5:0 "Great Laker Efficiency"
 germanic_sea_path_5_desc:0 "To raid you need personnel and a boat. Give me more ships!"
 germanic_sea_path_6:0 "Steadfast like a Tree"
 germanic_sea_path_6_desc:0 "To remain stoically steadfast in even the harshest of times makes the most excellent of warriors."
 germanic_sea_path_7:0 "The Ger"
 germanic_sea_path_7_desc:0 "The Ger, or Framea, is a Germanic javelin or spear for close-quarters. This weapon may have given the name to the region."
 germanic_sea_path_8:0 "Forest Combat"
 germanic_sea_path_8_desc:0 "Great Laker warriors trained in the forests and achieved a level of cooperation that many do not think possible."
 germanic_sea_path_9:0 "In the Name of Thor"
 germanic_sea_path_9_desc:0 "The many tribal wars could only be sustained and compensated by the high birth rate. And in times of peace, the warriors needed a way to enjoy themselves... all in the name of Freyr, of course."
 germanic_sea_path_10:0 "Raiding Parties"
 germanic_sea_path_10_desc:0 "More and more, the raids reached further and further south. Many came back with items never seen before and the attraction to risk your life for glory only grows..."
 germanic_sea_path_11:0 "Flanking Maneuvers"
 germanic_sea_path_11_desc:0 "Great Laker cavalry often flanked their enemies to strike the deathblow."
 germanic_sea_path_12:0 "Roaming War Bands"
 germanic_sea_path_12_desc:0 "Whilst out raiding, the war bands usually learn how to fight on diverse terrain."
 germanic_sea_path_13:0 "Protecting the Wagons"
 germanic_sea_path_13_desc:0 "Whilst you march, don't forget to protect your wagons."
 germanic_sea_path_14:0 "Warrior Class"
 germanic_sea_path_14_desc:0 "At some point, a dedicated warrior class established itself. Now they fight while others provide."

