l_english:
 ff_startup_event_1:0 "Eastern Rumors"
 ff_startup_event_1_desc:0 "News has reached us of the rebirth of the [GetCountry('PRI').GetName], led by the venerable and mighty [GetCharacter('(int32)19').GetName]. From his capital in [GetProvince('(int32)4077').GetName], the [GetCountry('PRI').GetReligion.GetName] faith has seen a massive resurgence. Such unified leadership of the #Y Americanists#! has not been seen since pre-Event times, and even some of our own have begun to doubt our ability to restore the #Y Republic#!, claiming that we should pledge our allegiance to [GetCharacter('(int32)19').GetName]. However, it is certain that the collapse of the #Y West Coast Command#!, all those years ago has spelled disaster for the [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] nations. We have fallen into disarray, clinging to the scraps of what once were.\n\nWhatever choice we make, it is clear that a great change is occuring - what choice are we to make?"
 ff_startup_event_1.a:0 "Hail, Columbia!"
 ff_startup_event_1.b:0 "We will place our faith in the American Caesar."
 ff_startup_event_1.c:0 "The teachings of the Heartfuls intrigue us..."
 caesarist_startup_mod:0 "The Last Stand of the Caesarists"

 ff_startup_event.2.t:0 "Hiawatha's Legacy"
 ff_startup_event.2.desc:3 "For over twenty years, the nascent [GetCountry('HAD').GetAdjective] Nation has fought a harsh campaign against the [GetCountry('UTC').GetAdjective] people to the north. Although victory often seemed far from grasp, the war ended in [GetCountry('HAD').GetName]'s favor, resulting in the liberation of the important Haudenosaunee [GetProvince('(int32)6853').Custom('get_city_type_loc')] of [GetProvince('(int32)6853').GetName]. For the first time in a generation, the restoration of the Confederacy established by the Great Peacemaker and Hiawatha seems less like a pipe-dream. [GetCharacter('(int32)37').GetName] has stylized himself not only the leader of the Onondaga, but of all the [GetCulture('haudenosaunee').GetName]. The [GetCountry('UTC').GetAdjective]s, however, having retreated to lick their wounds, are far from defeated.\n\nTo the west, the [GetCountry('ROC').GetAdjective] people eye the expansion of the Confederacy with apprehension; to the east, myriad Americanist city-states plot behind one another's backs, all the while appealing to their benefactor in Philadelphia, for aid. In Ontario stands the mighty realm of [GetCountry('ONT').GetName], seemingly a great power, but dealing with internal struggles.\n\nWill the Onondaga revive the laws of the Great Peacemaker; or fall to internal strife and external foes? The fate of the Confederacy rests in your hands."
 ff_startup_event.2.a:0 "For the Confederacy!"
 ff_startup_event.2.tt:0 "We'll have a truce with [GetCountry('UTC').GetName] until #Y 1.11.453#! and with [GetCountry('ROC').GetName] until #Y 1.06.455#!."
 make_history_tt:0 "Time to make history..."

 ff_startup_event.3.t:1 "Successors of Columbia"
 ff_startup_event.3.desc:2 "Thirty one years ago, the Philadelphian Senator #E [GetCharacter('(int32)19').GetPraenomen]#! recieved a divine sign from the Founders, leading him to proclaim a restored America. While his initial campaigns were met with much sucess, making [GetCharacter('(int32)19').GetPraenomen] the most lauded #Y President#! since #Y Washington#! himself, there are others who style themselves as the true successors to #Y America#!.\n\nIn Jersey, the squabbling cities have been brought under one leader, [GetCharacter('(int32)10').GetName]. His coalition of #Y Conclavian#! realms have proven to be a real thorn in the side of [GetCountry('PRI').GetName].\n\nThe mighty empire established by Liam 'the Architect' Mahonic has been suceeded by his son, [GetCountry('BOS').GetRuler.GetName]. [GetCountry('BOS').GetName] is in a tenuous position, the only real bulwark against the Americanists.\n\nIn the lands of the Old South, the #Y Royall#! family has long ruled from [GetProvince('(int32)5068').GetName]. However, [GetCharacter('(int32)22').GetPraenomen] may take a very different path than the one of his ancestors..."
 ff_startup_event.3.a:0 "The die is cast."
 ff_startup_event.3.at:1 "Time to make history..."
 make_history_tt:0 "Time to make history..."

 ff_startup_event.3.desc_monarchy:0 "\n\nFor many years, the Americanist realms and their neighbors have been locked in a bitter struggle over the future of #Y America#!, drawing all nations within their sphere of influence into the conflict. The wars of the #Y President#! will surely continue; perhaps it is up to the #E [ROOT.GetCountry.GetAdjective] Kingdom#! to decide how they will end."
 ff_startup_event.3.desc_republic:0 "\n\nFor many years, the Americanist realms and their neighbors have been locked in a bitter struggle over the future of #Y America#!, drawing all nations within their sphere of influence into the conflict. The wars of the #Y President#! will surely continue; perhaps it is up to the #E [ROOT.GetCountry.GetAdjective] Republic#! to decide how they will end." 
 ff_startup_event.3.desc_generic:0 "\n\nFor many years, the Americanist realms and their neighbors have been locked in a bitter struggle over the future of #Y America#!, drawing all nations within their sphere of influence into the conflict. The wars of the #Y President#! will surely continue; perhaps it may be up to #E [ROOT.GetCountry.GetName]#! to decide how they will end."

 ff_startup_event.4.t:1 "The Center of the Universe"
 ff_startup_event.4.desc:2 "Known to the #Y Twainists#! and #Y Cahokians#! as the center of the universe and navel of the world, [GetProvince('(int32)4206').GetName] has remained as one of the most important cities along the Mississippi. With all her gilded splendor, it is no wonder that the city has changed hands so many times after the Deluge. First held by the semi-mythical Republic of the Mississippi, the city was then a stronghold of the Cahokian Sun Kings, and thereafter it has been ruled by the Busch Dynasty for more than a generation.\n\nDespite the great wealth and power of [GetCharacter('(int32)0').GetName], the fate of the Gateway to the West lay on a knife's edge. Recent developments have spurred the many factions in the city into action..."
 ff_startup_event.4.a:0 "Who will rule Mound City?"

 CURRENT_DATE_TOOLTIP:2 "#T Current Date#!\nThe game counts using the Gregorian calendar, which was commonly used by the great empires before The Event.\n\n#TF Pythagoras, when he was asked what time was, answered that it was the soul of this world.#!"