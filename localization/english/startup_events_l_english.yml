l_english:
 ff_startup_event_1:0 "American Resurgence"
 ff_startup_event_1_desc:0 "News has reached us of the rebirth of the [GetCountry('PRI').GetName], led by the venerable and mighty [GetCharacter('(int32)19').GetName]. From his capital in [GetProvince('(int32)4077').GetName], the [GetCountry('PRI').GetReligion.GetName] faith has seen a massive resurgence. Such unified leadership of the #Y Americanists#! has not been seen since pre-Event times, and even some of our own have begun to doubt our ability to restore the #Y Republic#!, claiming that we should pledge our allegiance to [GetCharacter('(int32)19').GetName]. However, it is certain that the collapse of the #Y West Coast Command#!, all those years ago has spelled disaster for the [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] nations. We have fallen into disarray, clinging to the scraps of what once were.\n\nWhatever choice we make, it is clear that a great change is occuring - what choice are we to make?"
 ff_startup_event_1.a:0 "Hail, Columbia!"
 ff_startup_event_1.b:0 "We will place our faith in the American Caesar."
 ff_startup_event_1.c:0 "The teachings of the Heartfuls intrigue us..."
 caesarist_startup_mod:0 "The Last Stand of the Caesarists"

 CURRENT_DATE_TOOLTIP:2 "#T Current Date#!\nThe game counts using the Gregorian calendar, which was commonly used by the great empires before The Event.\n\n#TF Pythagoras, when he was asked what time was, answered that it was the soul of this world.#!"